<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BC Ops Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>

    :root {
      --bg: #080808;
      --surface: #0f0f0f;
      --card: #111111;
      --border: #1c1c1c;
      --border-hover: #2a2a2a;
      --gold: #D4A843;
      --gold-dim: rgba(212,168,67,0.15);
      --gold-glow: rgba(212,168,67,0.25);
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.12);
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.12);
      --yellow: #fbbf24;
      --yellow-dim: rgba(251,191,36,0.12);
      --blue: #60a5fa;
      --blue-dim: rgba(96,165,250,0.12);
      --text: #e0e0e0;
      --text-muted: #999;
      --text-dim: #c0c0c0;
      --radius: 10px;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Dot grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #1e1e1e 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, transparent 40%, #080808 100%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 32px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    .logo-img {
      height: 44px;
      width: 44px;
      object-fit: contain;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .header-title { line-height: 1; }
    .header-title h1 {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .header-title p {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    .header-right { display: flex; align-items: center; gap: 16px; }

    .status-dot {
      display: flex; align-items: center; gap: 7px;
      font-family: var(--mono);
      font-size: 11px;
      color: #aaa;
    }
    .status-dot::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }
    .refresh-btn.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Section header ── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-label {
      font-family: var(--mono);
      font-size: 11px;
      color: #999;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .section-count {
      font-family: var(--mono);
      font-size: 11px;
      color: #999;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.4s ease both;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--card-accent, var(--border));
      transition: background 0.3s;
    }
    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .card:hover::before { background: var(--gold); }

    .card.status-success::before { background: var(--green); }
    .card.status-failure::before { background: var(--red); }
    .card.status-running::before { background: var(--yellow); animation: glow-yellow 1.5s ease-in-out infinite alternate; }
    @keyframes glow-yellow {
      from { box-shadow: 0 0 4px var(--yellow); }
      to   { box-shadow: 0 0 12px var(--yellow); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:nth-child(1) { animation-delay: 0.05s }
    .card:nth-child(2) { animation-delay: 0.10s }
    .card:nth-child(3) { animation-delay: 0.15s }
    .card:nth-child(4) { animation-delay: 0.20s }
    .card:nth-child(5) { animation-delay: 0.25s }
    .card:nth-child(6) { animation-delay: 0.30s }
    .card:nth-child(7) { animation-delay: 0.35s }
    .card:nth-child(8) { animation-delay: 0.40s }

    /* Card top */
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .card-icon {
      width: 36px; height: 36px;
      background: #181818;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      font-family: var(--mono);
      color: var(--gold);
      font-weight: 600;
      flex-shrink: 0;
    }
    .card-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }

    /* Badges */
    .badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .badge-cron    { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(212,168,67,0.2); }
    .badge-manual  { background: #181818; color: var(--text-muted); border: 1px solid var(--border); }
    .badge-ok      { background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
    .badge-fail    { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
    .badge-running { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(251,191,36,0.2); }
    .badge-none    { background: #181818; color: var(--text-muted); border: 1px solid var(--border); }
    .badge-cancelled { background: #181818; color: var(--text-muted); border: 1px solid var(--border); }

    /* Card body */
    .card-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      letter-spacing: -0.2px;
    }
    .card-desc {
      font-size: 12px;
      color: #aaa;
      line-height: 1.6;
      font-family: var(--mono);
      font-weight: 400;
    }

    /* Card meta */
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .meta-label {
      font-family: var(--mono);
      font-size: 10px;
      color: #888;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .meta-value {
      font-family: var(--mono);
      font-size: 11px;
      color: #d0d0d0;
      text-align: right;
    }
    .meta-value a {
      color: #c0c0c0;
      text-decoration: none;
    }
    .meta-value a:hover { color: var(--gold); text-decoration: underline; }

    /* Card footer */
    .card-footer { display: flex; gap: 8px; }

    .btn-trigger {
      flex: 1;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-trigger:hover {
      background: var(--gold);
      color: #000;
    }
    .btn-trigger:active { transform: scale(0.98); }
    .btn-trigger:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-trigger.loading {
      pointer-events: none;
      opacity: 0.7;
    }
    .btn-trigger .spinner {
      width: 11px; height: 11px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .btn-logs {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 9px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: flex; align-items: center;
    }
    .btn-logs:hover { border-color: var(--border-hover); color: var(--text); }

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, #111 25%, #181818 50%, #111 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 4px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .card-skeleton .card-name { height: 16px; width: 70%; }
    .card-skeleton .card-desc { height: 11px; width: 90%; margin-top: 8px; }
    .card-skeleton .card-desc + .card-desc { width: 65%; margin-top: 4px; }
    .card-skeleton .btn-trigger { height: 36px; border: none; background: #181818; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #111;
      border: 1px solid var(--border-hover);
      border-radius: 14px;
      width: 100%; max-width: 420px;
      padding: 28px;
      transform: translateY(16px) scale(0.97);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-icon {
      width: 40px; height: 40px;
      background: var(--gold-dim);
      border: 1px solid rgba(212,168,67,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-size: 16px;
      color: var(--gold);
    }
    .modal-close {
      background: transparent; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 18px; padding: 4px;
      transition: color 0.2s; line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    .modal h2 {
      font-size: 16px; font-weight: 700; color: #fff;
      margin-bottom: 4px; letter-spacing: -0.3px;
    }
    .modal p {
      font-family: var(--mono);
      font-size: 11px; color: var(--text-muted);
      line-height: 1.6;
    }

    .form-group { margin-top: 20px; }
    .form-group label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .form-group input[type="date"] {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid var(--border-hover);
      border-radius: 7px;
      padding: 10px 12px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      color-scheme: dark;
    }
    .form-group input[type="date"]:focus { border-color: var(--gold); }
    .form-hint {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .modal-actions {
      display: flex; gap: 10px; margin-top: 24px;
    }
    .btn-cancel {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border-hover);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      padding: 11px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cancel:hover { border-color: var(--text-muted); color: var(--text); }
    .btn-confirm {
      flex: 2;
      background: var(--gold);
      border: none;
      color: #000;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 11px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      letter-spacing: 0.3px;
    }
    .btn-confirm:hover { background: #e6b84a; }
    .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-confirm .spinner {
      width: 13px; height: 13px;
      border: 2px solid #000;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 28px; right: 28px;
      display: flex; flex-direction: column; gap: 10px;
      z-index: 200;
    }
    .toast {
      background: #1a1a1a;
      border: 1px solid var(--border-hover);
      border-left: 3px solid var(--green);
      border-radius: 8px;
      padding: 12px 16px;
      min-width: 280px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .toast.error { border-left-color: var(--red); }
    .toast strong { display: block; margin-bottom: 2px; color: #fff; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(20px); }
    }

    /* ── Section groups ── */
    .section-group { margin-bottom: 48px; }
    .section-group:last-child { margin-bottom: 0; }
    .section-pill {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 10px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 20px;
    }
    .pill-diario   { background: rgba(74,222,128,0.1);  color: var(--green);  border: 1px solid rgba(74,222,128,0.25); }
    .pill-semanal  { background: rgba(96,165,250,0.1);  color: var(--blue);   border: 1px solid rgba(96,165,250,0.25); }
    .pill-mensual  { background: rgba(212,168,67,0.12); color: var(--gold);   border: 1px solid rgba(212,168,67,0.25); }
    .pill-desactivado { background: rgba(255,255,255,0.04); color: #555; border: 1px solid #222; }
    .section-pill::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
    }
    .pill-diario::before   { box-shadow: 0 0 5px var(--green); animation: pulse-dot 2s ease-in-out infinite; }
    .section-divider {
      border: none; border-top: 1px solid var(--border);
      margin: 0 0 40px;
    }

    /* ── Error state ── */
    .error-state {
      text-align: center;
      padding: 60px 20px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-muted);
    }
    .error-state p { margin-top: 8px; font-size: 11px; color: var(--red); }
  

    /* ── Navigation Tabs ── */
    .nav-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      width: fit-content;
    }
    .nav-tab {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .nav-tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .nav-tab.active {
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid rgba(212,168,67,0.25);
    }

    /* ── Dashboard ── */
    #dashboard-view { display: block; }
    #workflows-view { display: none; }

    .dash-section {
      margin-bottom: 28px;
    }
    .dash-section-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .dash-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .dash-grid-2 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 768px) {
      .dash-grid-3, .dash-grid-2 { grid-template-columns: 1fr; }
    }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      transition: border-color 0.2s;
    }
    .kpi-card:hover { border-color: var(--border-hover); }
    .kpi-card.gold-accent { border-left: 3px solid var(--gold); }
    .kpi-card.green-accent { border-left: 3px solid var(--green); }
    .kpi-card.red-accent { border-left: 3px solid var(--red); }
    .kpi-card.blue-accent { border-left: 3px solid var(--blue); }

    .kpi-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .kpi-value {
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }
    .kpi-value.gold { color: var(--gold); }
    .kpi-value.green { color: var(--green); }
    .kpi-value.red { color: var(--red); }
    .kpi-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .kpi-sub span { color: var(--text-dim); }

    .kpi-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
    }
    .kpi-badge.up { background: var(--green-dim); color: var(--green); }
    .kpi-badge.down { background: var(--red-dim); color: var(--red); }
    .kpi-badge.neutral { background: rgba(255,255,255,0.06); color: var(--text-muted); }

    /* Channel bars */
    .channel-bar-wrap { margin-top: 10px; }
    .channel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .channel-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      width: 70px;
      text-align: right;
    }
    .channel-bar {
      flex: 1;
      height: 16px;
      background: rgba(255,255,255,0.04);
      border-radius: 4px;
      overflow: hidden;
    }
    .channel-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }
    .channel-fill.gold { background: var(--gold); opacity: 0.7; }
    .channel-fill.blue { background: var(--blue); opacity: 0.7; }
    .channel-fill.green { background: var(--green); opacity: 0.7; }
    .channel-pct {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      width: 42px;
    }

    /* Reviews card */
    .review-platform {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .review-platform:last-child { border-bottom: none; }
    .review-stars {
      font-size: 13px;
      color: var(--gold);
      letter-spacing: -1px;
    }
    .review-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Weekly KPI mini table */
    .kpi-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 11px;
    }
    .kpi-table th {
      color: var(--text-muted);
      font-weight: 500;
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-table td {
      padding: 5px 8px;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .kpi-table .val-up { color: var(--green); }
    .kpi-table .val-down { color: var(--red); }
    .kpi-table .val-neutral { color: var(--text-dim); }

    /* Alert list */
    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 12px;
      margin-bottom: 4px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .alert-item.alert-red { background: var(--red-dim); color: var(--red); }
    .alert-item.alert-green { background: var(--green-dim); color: var(--green); }
    .alert-item.alert-yellow { background: var(--yellow-dim); color: var(--yellow); }

    /* Dashboard loading */
    .dash-loading {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
    }
    .dash-error {
      text-align: center;
      padding: 40px;
      color: var(--red);
      font-family: var(--mono);
      font-size: 12px;
    }

    /* No data state */
    .no-data {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 16px;
      text-align: center;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* ── Meta Mensual Progress ── */
    .meta-progress-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .meta-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .meta-progress-bar {
      width: 100%;
      height: 22px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .meta-progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.8s ease;
    }
    .meta-progress-marker {
      position: absolute;
      top: 0;
      height: 100%;
      width: 2px;
      background: rgba(255,255,255,0.3);
    }
    .meta-progress-marker-label {
      position: absolute;
      top: -16px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-muted);
      transform: translateX(-50%);
    }

    /* ── Score Operacional ── */
    .score-gauge {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .score-ring {
      width: 90px;
      height: 90px;
      position: relative;
    }
    .score-ring svg {
      transform: rotate(-90deg);
    }
    .score-ring-value {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }
    .score-components {
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }
    .score-comp {
      text-align: center;
    }
    .score-comp-val {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
    }
    .score-comp-label {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Sparkline (Trends 7d) ── */
    .spark-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .spark-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .spark-svg {
      width: 100%;
      height: 80px;
    }
    .spark-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }
    .spark-label {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-muted);
    }

    /* ── CheckRocket Cards v2 ── */
    .cr-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .cr-score-big {
      font-family: var(--mono);
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }
    .cr-score-total {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 400;
      color: var(--text-muted);
    }
    .cr-cat-title {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin: 12px 0 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .cr-checklist-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      font-size: 12px;
      color: var(--text-dim);
    }
    .cr-checklist-row .cr-name { flex: 1; }
    .cr-badge-ok {
      background: #14532d;
      color: #4ade80;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .cr-badge-fail {
      background: #450a0a;
      color: #f87171;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .cr-badge-warn {
      background: #451a03;
      color: #fb923c;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .cr-detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
    }
    .cr-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .cr-alert-box {
      background: #1a0808;
      border: 1px solid #5a1a1a;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 8px;
      font-size: 11px;
    }
    .cr-merma-box {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 8px;
    }
    .cr-merma-prod {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .cr-merma-detail {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ── Garzones table ── */
    .garzon-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 11px;
    }
    .garzon-table th {
      color: var(--text-muted);
      font-weight: 500;
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .garzon-table td {
      padding: 5px 8px;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .garzon-table tr:first-child td { color: var(--gold); }

    /* ── Estimado Compra ── */
    .ec-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      font-family: var(--mono);
      font-size: 11px;
    }
    .ec-item:last-child { border-bottom: none; }
    .ec-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .ec-urgente { background: var(--red-dim); color: var(--red); }
    .ec-normal { background: rgba(255,255,255,0.06); color: var(--text-muted); }
  </style>
</head>
<body>

<div class="wrapper">
  <header>
    <div class="header-left">
      <img src="/logo.png" alt="BlackChicken" class="logo-img">
      <div class="header-title">
        <h1>OPS HUB</h1>
        <p>DASHBOARD OPERACIONAL</p>
      </div>
    </div>
    <div class="header-right">
      <div class="status-dot" id="status-text">CONECTADO</div>
      <button class="refresh-btn" onclick="refreshAll()" id="refresh-btn">↻ REFRESH</button>
    </div>
  </header>

  <!-- Navigation tabs -->
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-dashboard" onclick="switchView('dashboard')">Dashboard</button>
    <button class="nav-tab" id="tab-workflows" onclick="switchView('workflows')">Workflows</button>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view">
    <div class="dash-loading" id="dash-loading">Cargando datos operacionales...</div>
    <div id="dash-content" style="display:none"></div>
  </div>

  <!-- WORKFLOWS VIEW (existing) -->
  <div id="workflows-view" style="display:none">
    <div id="sections-container">
      <div class="section-header">
        <span class="section-label">WORKFLOWS</span>
        <span class="section-count" id="wf-count">cargando...</span>
      </div>
      <div class="grid">
        <div class="card card-skeleton">
          <div class="card-top"><div class="skeleton" style="width:36px;height:36px;border-radius:8px"></div></div>
          <div class="card-name skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-footer"><div class="btn-trigger skeleton"></div></div>
        </div>
        <div class="card card-skeleton">
          <div class="card-top"><div class="skeleton" style="width:36px;height:36px;border-radius:8px"></div></div>
          <div class="card-name skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-footer"><div class="btn-trigger skeleton"></div></div>
        </div>
        <div class="card card-skeleton">
          <div class="card-top"><div class="skeleton" style="width:36px;height:36px;border-radius:8px"></div></div>
          <div class="card-name skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-footer"><div class="btn-trigger skeleton"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal trigger -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-icon" id="modal-icon">▶</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <h2 id="modal-title">Ejecutar workflow</h2>
    <p id="modal-desc">Dispara el workflow manualmente.</p>

    <div class="form-group" id="date-group">
      <label>Fecha (opcional)</label>
      <input type="date" id="date-input" />
      <div class="form-hint">Vacío = ayer (comportamiento por defecto)</div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" id="btn-confirm" onclick="confirmTrigger()">
        <span id="confirm-text">▶ EJECUTAR</span>
      </button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>

  // ── View switching ─────────────────────────────────────────────────
  function switchView(view) {
    document.getElementById('dashboard-view').style.display = view === 'dashboard' ? 'block' : 'none';
    document.getElementById('workflows-view').style.display = view === 'workflows' ? 'block' : 'none';
    document.getElementById('tab-dashboard').classList.toggle('active', view === 'dashboard');
    document.getElementById('tab-workflows').classList.toggle('active', view === 'workflows');
    if (view === 'workflows' && !workflowsLoaded) loadWorkflows();
  }

  function refreshAll() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    loadDashboard();
    loadWorkflows();
    setTimeout(() => btn.classList.remove('spinning'), 2000);
  }

  let workflowsLoaded = false;

  // ── DASHBOARD ──────────────────────────────────────────────────────

  async function loadDashboard() {
    const loading = document.getElementById('dash-loading');
    const content = document.getElementById('dash-content');
    loading.style.display = 'block';
    content.style.display = 'none';

    try {
      const resp = await fetch('/api/dashboard');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      renderDashboard(data);
      loading.style.display = 'none';
      content.style.display = 'block';
    } catch (err) {
      loading.innerHTML = `<div class="dash-error">Error cargando dashboard: ${err.message}</div>`;
    }
  }

  function $(n) { return n != null ? n.toLocaleString('es-CL') : '—'; }
  function pct(n) { return n != null ? n.toFixed(1) + '%' : '—'; }
  function fmtDate(s) { if (!s) return s; const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; const p = s.split('-'); return p.length === 3 ? `${parseInt(p[2])} ${meses[parseInt(p[1])-1]}` : s; }

  function renderDashboard(data) {
    const el = document.getElementById('dash-content');
    const d = data.daily;
    const g = data.google_reviews;
    const u = data.uber_reviews;
    const w = data.weekly;
    const cr = data.checkrocket;
    const bd = data.briefing_detail;
    const tr = data.trends;
    const mm = data.meta_mensual;
    const sc = data.score_operacional;
    const ec = data.estimado_compra;

    let html = '';

    // Timestamp
    if (data.timestamp) {
      const ts = new Date(data.timestamp);
      const ago = Math.round((Date.now() - ts.getTime()) / 60000);
      const agoTxt = ago < 1 ? 'ahora' : ago < 60 ? `hace ${ago} min` : `hace ${Math.round(ago/60)}h`;
      html += `<div style="text-align:right;font-family:var(--mono);font-size:10px;color:#555;margin-bottom:8px;letter-spacing:0.5px">Última actualización: ${agoTxt}</div>`;
    }

    // ── Section 0: Score Operacional + Meta Mensual (top row) ──
    html += `<div class="dash-section"><div class="dash-grid" style="grid-template-columns: 260px 1fr; gap: 16px;">`;

    // Score gauge
    if (sc && sc.total != null) {
      const scoreColor = sc.total >= 85 ? 'var(--green)' : sc.total >= 65 ? 'var(--gold)' : 'var(--red)';
      const pctVal = Math.min(sc.total, 100);
      const circumference = 2 * Math.PI * 38;
      const offset = circumference - (pctVal / 100) * circumference;
      html += `
        <div class="kpi-card" style="text-align:center">
          <div class="kpi-label">Score Operacional</div>
          <div class="score-gauge">
            <div class="score-ring">
              <svg width="90" height="90" viewBox="0 0 90 90">
                <circle cx="45" cy="45" r="38" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/>
                <circle cx="45" cy="45" r="38" fill="none" stroke="${scoreColor}" stroke-width="6"
                  stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
                  stroke-linecap="round" style="transition:stroke-dashoffset 1s ease"/>
              </svg>
              <div class="score-ring-value">${sc.total}</div>
            </div>
            <div class="score-components">
              ${sc.components?.ventas ? `<div class="score-comp"><div class="score-comp-val" style="color:${sc.components.ventas.value >= 100 ? 'var(--green)' : 'var(--red)'}">${Math.round(sc.components.ventas.value)}%</div><div class="score-comp-label">Ventas</div></div>` : ''}
              ${sc.components?.checkrocket ? `<div class="score-comp"><div class="score-comp-val" style="color:${sc.components.checkrocket.value >= 85 ? 'var(--green)' : 'var(--gold)'}">${sc.components.checkrocket.value}%</div><div class="score-comp-label">CheckR</div></div>` : ''}
              ${sc.components?.reviews ? `<div class="score-comp"><div class="score-comp-val" style="color:${sc.components.reviews.value >= 80 ? 'var(--green)' : 'var(--red)'}">${sc.components.reviews.value}%</div><div class="score-comp-label">Reviews</div></div>` : ''}
            </div>
          </div>
        </div>`;
    } else {
      html += `<div class="kpi-card"><div class="kpi-label">Score Operacional</div><div class="no-data" style="border:none;background:none">Sin datos</div></div>`;
    }

    // Meta mensual progress
    if (mm) {
      const acumPct = mm.acumulado_pct || 0;
      const dayPct = ((mm.dia_actual / mm.dias_mes) * 100).toFixed(0);
      const fillColor = acumPct >= parseFloat(dayPct) ? 'var(--green)' : acumPct >= parseFloat(dayPct) * 0.85 ? 'var(--gold)' : 'var(--red)';
      const acumM = mm.acumulado_monto ? (mm.acumulado_monto / 1e6).toFixed(1) : '?';
      const metaM = (mm.meta_total / 1e6).toFixed(0);
      html += `
        <div class="kpi-card">
          <div class="meta-progress-header">
            <div class="kpi-label">Meta Mensual — $${metaM}M</div>
            <div class="kpi-sub" style="margin:0"><span style="color:${fillColor};font-weight:600">$${acumM}M</span> acumulado (${pct(acumPct)})</div>
          </div>
          <div class="meta-progress-bar" style="position:relative">
            <div class="meta-progress-fill" style="width:${Math.min(acumPct, 100)}%;background:${fillColor}"></div>
            <div class="meta-progress-marker" style="left:${dayPct}%">
              <div class="meta-progress-marker-label">Día ${mm.dia_actual}/${mm.dias_mes}</div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:10px">
            <div class="kpi-sub">BC1: $${(mm.meta_bc1/1e6).toFixed(0)}M</div>
            <div class="kpi-sub">BC2: $${(mm.meta_bc2/1e6).toFixed(0)}M</div>
            <div class="kpi-sub" style="color:${acumPct >= parseFloat(dayPct) ? 'var(--green)' : 'var(--red)'}">${acumPct >= parseFloat(dayPct) ? '▲ Sobre ritmo' : '▼ Bajo ritmo'}</div>
          </div>
          ${mm.projected ? `<div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px">
            <div class="kpi-sub" style="margin-bottom:6px"><span style="color:${mm.will_hit_meta ? 'var(--green)' : 'var(--red)'}">Proyección: $${(mm.projected/1e6).toFixed(1)}M (${mm.projected_pct}% de meta)</span></div>
            <div style="font-size:10px;color:#888">Al ritmo actual llegarías a $${(mm.projected/1e6).toFixed(1)}M</div>
          </div>` : ''}
        </div>`;
    } else {
      html += `<div class="kpi-card"><div class="kpi-label">Meta Mensual</div><div class="no-data" style="border:none;background:none">Sin datos</div></div>`;
    }

    html += `</div></div>`;

    // ── Section 1: Ventas del día ──
    if (d) {
      const metaBadge = d.meta_diaria_pct >= 100 ? 'up' : d.meta_diaria_pct >= 85 ? 'neutral' : 'down';
      const metaIcon = d.meta_diaria_pct >= 100 ? '▲' : d.meta_diaria_pct >= 85 ? '—' : '▼';

      const deltaBadge = bd?.delta_ventas_pct ? (bd.delta_ventas_pct >= 0 ? 'green' : 'red') : '';
      const deltaText = bd?.delta_ventas_pct && bd?.prev_day_label ? `vs ${bd.prev_day_label}: ${bd.delta_ventas_pct >= 0 ? '+' : ''}${bd.delta_ventas_pct.toFixed(1)}%` : '';

      html += `
        <div class="dash-section">
          <div class="dash-section-title">VENTAS DEL DÍA ${d.fecha ? '— ' + d.fecha : ''}</div>
          <div class="dash-grid" style="grid-template-columns: 1.4fr 1fr 1fr;">
            <div class="kpi-card gold-accent">
              <div class="kpi-label">Ventas Totales</div>
              <div class="kpi-value gold">$${$(d.ventas_total)}</div>
              <div class="kpi-sub">
                ${pct(d.meta_pct)} de meta mensual
                <span class="kpi-badge ${metaBadge}">${metaIcon} ${pct(d.meta_diaria_pct)} meta diaria</span>
                ${deltaText ? `<span class="kpi-badge ${deltaBadge}" style="margin-left:6px">${deltaText}</span>` : ''}
              </div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">BC1 — El Plomo 5931</div>
              <div class="kpi-value">$${$(d.bc1?.ventas)}</div>
              <div class="kpi-sub">${$(d.bc1?.cuentas)} cuentas · ticket $${$(d.bc1?.ticket)}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">BC2 — El Plomo 5630</div>
              <div class="kpi-value">$${$(d.bc2?.ventas)}</div>
              <div class="kpi-sub">${$(d.bc2?.cuentas)} cuentas · ticket $${$(d.bc2?.ticket)}</div>
            </div>
          </div>
        </div>`;

      // ── Section 1b: Tendencias 7 días ──
      if (tr && tr.length > 1) {
        const vals = tr.map(t => t.ventas || 0);
        const maxV = Math.max(...vals, 1);
        const minV = Math.min(...vals);
        const w = 600, h = 70, pad = 4;
        const step = (w - pad * 2) / (vals.length - 1);
        const points = vals.map((v, i) => {
          const x = pad + i * step;
          const y = h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad * 2);
          return `${x},${y}`;
        }).join(' ');

        const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
        const avgY = h - pad - ((avg - minV) / (maxV - minV || 1)) * (h - pad * 2);

        // Calculate average ticket from trends data
        const totalVentas = vals.reduce((a, b) => a + b, 0);
        const totalCuentas = tr.reduce((sum, t) => sum + (t.cuentas || 0), 0);
        const avgTicket = totalCuentas > 0 ? Math.round(totalVentas / totalCuentas) : null;

        html += `
        <div class="dash-section">
          <div class="spark-wrap">
            <div class="spark-header">
              <div class="kpi-label" style="margin:0">Tendencia 7 Días</div>
              <div class="kpi-sub" style="margin:0">Prom: <span style="color:var(--gold)">$${$(Math.round(avg))}</span>${avgTicket ? ` · Ticket: <span style="color:#888">$${$(avgTicket)}</span>` : ''}
                <span style="margin-left:12px;font-size:9px;color:#555">
                  <span style="color:rgba(212,168,67,0.5)">━</span> BC1
                  <span style="color:rgba(96,165,250,0.5);margin-left:6px">━</span> BC2
                </span>
              </div>
            </div>
            <svg class="spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
              <line x1="${pad}" y1="${avgY}" x2="${w-pad}" y2="${avgY}" stroke="rgba(212,168,67,0.2)" stroke-width="1" stroke-dasharray="4"/>
              ${(() => {
                // BC1 sub-line (gold, thin)
                const bc1Vals = tr.map(t => t.bc1 || 0);
                const bc1Pts = bc1Vals.map((v, i) => `${pad + i * step},${h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad * 2)}`).join(' ');
                // BC2 sub-line (blue, thin)
                const bc2Vals = tr.map(t => t.bc2 || 0);
                const bc2Pts = bc2Vals.map((v, i) => `${pad + i * step},${h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad * 2)}`).join(' ');
                const hasSub = bc1Vals.some(v => v > 0) && bc2Vals.some(v => v > 0);
                return hasSub ? `<polyline points="${bc1Pts}" fill="none" stroke="rgba(212,168,67,0.35)" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3"/>
                <polyline points="${bc2Pts}" fill="none" stroke="rgba(96,165,250,0.35)" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3"/>` : '';
              })()}
              <polyline points="${points}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>
              ${vals.map((v, i) => {
                const bc1v = tr[i]?.bc1; const bc2v = tr[i]?.bc2;
                const tip = `$${$(v)}${bc1v ? ' (BC1 $' + $(bc1v) + ')' : ''}${bc2v ? ' (BC2 $' + $(bc2v) + ')' : ''}`;
                const x = pad + i * step;
                const y = h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad * 2);
                return `<circle cx="${x}" cy="${y}" r="4" fill="var(--gold)" stroke="var(--bg)" stroke-width="1.5"><title>${tip}</title></circle>`;
              }).join('')}
            </svg>
            <div class="spark-labels">
              ${tr.map(t => {
                const f = t.fecha || '';
                const m = f.match(/(\d{1,2})\s+de\s+(\w+)/);
                const lbl = m ? m[1] + ' ' + m[2].substring(0,3) : f.split(' ').pop() || '';
                return `<span class="spark-label">${lbl}</span>`;
              }).join('')}
            </div>
          </div>
        </div>`;
      }

      // ── Section 2: Canales ──
      if (d.canales) {
        html += `
        <div class="dash-section">
          <div class="dash-section-title">CANALES</div>
          <div class="dash-grid-2">
            <div class="kpi-card">
              <div class="kpi-label">Por plataforma</div>
              <div class="channel-bar-wrap">
                ${channelBar('POS', d.canales.pos, 'gold')}
                ${channelBar('UberEats', d.canales.uber, 'blue')}
                ${channelBar('Justo', d.canales.justo, 'green')}
              </div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Por tipo de venta</div>
              <div class="channel-bar-wrap">
                ${d.tipo_venta ? channelBar('Mesa', d.tipo_venta.mesa, 'gold') : ''}
                ${d.tipo_venta ? channelBar('Delivery', d.tipo_venta.delivery, 'blue') : ''}
                ${d.tipo_venta ? channelBar('Retiro', d.tipo_venta.retiro, 'green') : ''}
              </div>
            </div>
          </div>
        </div>`;
      }

      // ── Section 3: Alertas ──
      const hasAnulacionAlert = (d.cancelled_count > 5) || (d.cancel_total > 100000);
      if (d.alertas.length || d.positivo.length || hasAnulacionAlert) {
        html += `<div class="dash-section"><div class="dash-section-title">ALERTAS DEL DÍA</div>`;
        if (hasAnulacionAlert) {
          const anulMsg = `Anulaciones: ${d.cancelled_count ? d.cancelled_count + ' órdenes' : ''} ${d.cancel_total ? '($' + $(d.cancel_total) + ')' : ''}`.trim();
          html += `<div class="alert-item alert-red">⚠️ ${anulMsg}</div>`;
        }
        d.alertas.forEach(a => { html += `<div class="alert-item alert-red">🔴 ${a}</div>`; });
        d.positivo.forEach(p => { html += `<div class="alert-item alert-green">✅ ${p}</div>`; });
        html += `</div>`;
      }
    } else {
      html += `<div class="no-data">Sin datos de briefing disponibles</div>`;
    }

    // ── Section 4: CheckRocket (v2 — por checklist) ──
    if (cr && (cr.bc1 || cr.bc2)) {
      html += `
      <div class="dash-section">
        <div class="dash-section-title">CHECKROCKET — CUMPLIMIENTO OPERACIONAL</div>
        <div class="dash-grid-2">`;

      ['bc1', 'bc2'].forEach((loc, idx) => {
        const c = cr[loc];
        if (!c) return;
        const label = idx === 0 ? 'BC1 — El Plomo 5931' : 'BC2 — El Plomo 5630';
        const pct = c.score_pct ?? (c.completed && c.total ? Math.round(c.completed/c.total*100*10)/10 : null);
        const scoreColor = pct >= 90 ? 'var(--green)' : pct >= 70 ? 'var(--gold)' : 'var(--red)';
        const accentClass = pct >= 90 ? 'green-accent' : pct >= 70 ? '' : 'red-accent';

        // Group checklists by category
        const cats = {cocina: [], salon: [], jefaturas: [], periodicos: []};
        (c.checklists || []).forEach(cl => {
          if (cats[cl.category]) cats[cl.category].push(cl);
          else cats.cocina.push(cl);
        });

        const realizados = (c.checklists || []).filter(cl => cl.status === 'realizado').length;
        const noRealizados = (c.checklists || []).filter(cl => cl.status === 'no_realizado').length;

        html += `
          <div class="cr-card ${accentClass}">
            <div class="kpi-label">${label}${c.jefe_local ? ` · Jefe: ${c.jefe_local}` : ''}</div>
            <div style="display:flex;align-items:baseline;gap:6px;margin:8px 0">
              <span class="cr-score-big" style="color:${scoreColor}">${pct ?? '?'}%</span>
              <span class="cr-score-total">${c.completed ?? realizados} / ${c.total ?? (realizados + noRealizados)}</span>
            </div>`;

        // Render checklists by category
        const catLabels = {cocina: '🍳 Cocina', salon: '🍽️ Salón', jefaturas: '📋 Jefaturas', periodicos: '🔄 Periódicos'};
        for (const [cat, items] of Object.entries(cats)) {
          if (!items.length) continue;
          html += `<div class="cr-cat-title">${catLabels[cat]}</div>`;
          items.forEach(cl => {
            const isOk = cl.status === 'realizado';
            let badgeCls = 'cr-badge-ok';
            let badgeTxt = '✅ Realizado';
            if (!isOk) {
              badgeCls = 'cr-badge-fail';
              badgeTxt = '❌ No Realizado';
            } else if (cl.badge && (cl.badge.includes('Incompleto') || cl.badge.includes('Alertas'))) {
              badgeCls = 'cr-badge-warn';
              badgeTxt = cl.badge;
            } else if (cl.badge && cl.badge !== '✅ OK' && cl.badge !== '100%') {
              badgeTxt = cl.badge;
            }
            html += `<div class="cr-checklist-row"><span class="cr-name">${cl.name || 'Sin nombre'}</span><span class="${badgeCls}">${badgeTxt}</span></div>`;
          });
        }

        // Temps fuera de rango
        if (c.temps_fuera?.length) {
          html += `<div class="cr-alert-box">
            <div style="color:#f87171;font-weight:600;margin-bottom:6px">🔴 Temperaturas Fuera de Rango</div>`;
          c.temps_fuera.forEach(t => {
            html += `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11px"><span style="color:#fff">${t.equipo}</span><span style="color:#f87171;font-weight:600">${t.temp}</span></div>`;
          });
          html += `</div>`;
        }
        if (c.temps_limite?.length) {
          html += `<div style="margin-top:6px;font-size:11px;color:var(--text-muted)">⚠️ En límite: ${c.temps_limite.map(t => `${t.equipo} (${t.temp})`).join(', ')}</div>`;
        }

        // No Cumple detalle
        if (c.no_cumple?.length) {
          html += `<div class="cr-alert-box" style="border-color:#5a3a1a">
            <div style="color:#fb923c;font-weight:600;margin-bottom:6px">⚠️ Ítems No Cumple</div>`;
          c.no_cumple.forEach(nc => {
            html += `<div style="font-size:11px;padding:3px 0"><span style="color:#fff">${nc.item}</span>${nc.detail ? `<br><span style="color:#888">${nc.detail}</span>` : ''}</div>`;
          });
          html += `</div>`;
        }

        // Merma
        if (c.merma?.length) {
          html += `<div class="cr-merma-box">
            <div style="font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">🗑️ Merma Declarada${c.merma_costo_total ? ` — $${c.merma_costo_total}` : ''}</div>`;
          c.merma.forEach(m => {
            html += `<div class="cr-merma-prod">${m.producto} — ${m.cantidad}${m.costo ? ` <span style="color:#f87171;font-size:12px">${m.costo}</span>` : ''}</div>
              <div class="cr-merma-detail">${m.motivo ? `Motivo: ${m.motivo}` : ''}${m.autoriza ? ` · Autoriza: ${m.autoriza}` : ''}</div>`;
          });
          html += `</div>`;
        } else if (c.merma_count === 0) {
          html += `<div style="font-size:11px;color:var(--text-muted);margin-top:6px">🗑️ Sin merma declarada</div>`;
        }

        // Piloto automático
        if (c.piloto_auto) {
          html += `<div class="cr-alert-box" style="margin-top:8px">
            <div style="color:#f87171;font-weight:600;margin-bottom:4px">⚡ Piloto Automático Detectado</div>
            <div style="font-size:11px;color:#ccc">${c.piloto_auto}</div>
          </div>`;
        }

        html += `</div>`;
      });

      html += `</div></div>`;
    }

    // ── Section 5: Reviews ──
    if (g || u) {
      html += `
      <div class="dash-section">
        <div class="dash-section-title">REVIEWS</div>
        <div class="dash-grid-2">`;

      if (g) {
        const g1neg = g.bc1?.negativas_7d || 0;
        const g2neg = g.bc2?.negativas_7d || 0;
        const gAccent = (g1neg + g2neg) > 0 ? 'red-accent' : 'green-accent';
        html += `
          <div class="kpi-card ${gAccent}">
            <div class="kpi-label">Google Reviews (7 días)</div>
            <div class="review-platform">
              <div>
                <span style="color:#fff;font-weight:600">BC1</span>
                <span class="review-stars">${'★'.repeat(Math.round(g.bc1?.rating || 0))}</span>
                <span class="review-count">${g.bc1?.rating}★ · ${$(g.bc1?.total_reviews)} total</span>
              </div>
              <div class="review-count">${g.bc1?.reviews_7d || 0} nuevas · ${g1neg} neg</div>
            </div>
            <div class="review-platform">
              <div>
                <span style="color:#fff;font-weight:600">BC2</span>
                <span class="review-stars">${'★'.repeat(Math.round(g.bc2?.rating || 0))}</span>
                <span class="review-count">${g.bc2?.rating}★ · ${$(g.bc2?.total_reviews)} total</span>
              </div>
              <div class="review-count">${g.bc2?.reviews_7d || 0} nuevas · ${g2neg} neg</div>
            </div>
          </div>`;
      }

      if (u) {
        const uAccent = u.expiring > 0 ? 'red-accent' : u.pending > 0 ? 'blue-accent' : 'green-accent';
        html += `
          <div class="kpi-card ${uAccent}">
            <div class="kpi-label">Uber Eats Reviews</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px">
              <div>
                <div class="kpi-value" style="font-size:22px">${u.pending}</div>
                <div class="kpi-sub">pendientes</div>
              </div>
              <div>
                <div class="kpi-value ${u.expiring > 0 ? 'red' : ''}" style="font-size:22px">${u.expiring}</div>
                <div class="kpi-sub">por vencer (≤5d)</div>
              </div>
              <div>
                <div class="kpi-value" style="font-size:22px">${u.new_today}</div>
                <div class="kpi-sub">nuevas hoy</div>
              </div>
              <div>
                <div class="kpi-value green" style="font-size:22px">${u.responded_today}</div>
                <div class="kpi-sub">respondidas</div>
              </div>
            </div>
            ${u.urgent?.length ? `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
              <div class="kpi-sub" style="color:var(--red);margin-bottom:6px">🚨 Urgentes (≤3 días):</div>
              ${u.urgent.map(r => `<div class="kpi-sub">${'★'.repeat(r.estrellas||1)}${'☆'.repeat(5-(r.estrellas||1))} ${r.nombre || '?'}: ${(r.comentario||'').substring(0,50)}${(r.comentario||'').length > 50 ? '...' : ''}</div>`).join('')}
            </div>` : ''}
          </div>`;
      }

      html += `</div></div>`;
    }

    // ── Section 6: Ranking Productos + Curva Horaria + Garzones ──
    const hasGarzones = bd && (bd.garzones_bc1?.length || bd.garzones_bc2?.length || bd.garzones?.length);
    const hasProducts = bd && (bd.product_ranking_revenue?.length || bd.top_productos?.length);
    const hasHourly = bd && bd.hourly_curve?.length;
    if (bd && (hasProducts || hasHourly || hasGarzones)) {
      html += `<div class="dash-section">
        <div class="dash-section-title">DETALLE DEL DÍA</div>`;

      // Ranking Productos (new dual-view format)
      if (bd.product_ranking_revenue?.length) {
        html += `<div class="dash-grid-2" style="margin-bottom:12px">`;

              <tbody>`;
        bd.product_ranking_revenue.forEach(p => {

            <td>${p.name}</td>
            <td>$${$(p.revenue)}</td>
            <td>${p.units}</td>
          </tr>`;

        html += `</tbody></table></div>`;
        // By units
        if (bd.product_ranking_units?.length) {

              <td>${p.units}</td>

      } else if (bd.top_productos?.length) {

              <tbody>`;
        bd.top_productos.forEach(p => {

            <td>${p.rank}</td>
            <td style="color:#fff">${p.name}</td>

            <td>$${$(p.revenue)}</td>
          </tr>`;

        html += `</tbody></table></div>`;
      }

      // Curva Horaria
      if (bd.hourly_curve?.length) {
        const maxSales = Math.max(...bd.hourly_curve.map(h => h.sales));

          const pct = maxSales > 0 ? (h.sales / maxSales * 100) : 0;
          const isPeak = h.sales === maxSales;
          const barColor = isPeak ? 'var(--gold)' : 'var(--gold-dim, #8a7030)';
          html += `<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px">

            <span style="min-width:110px;text-align:right;color:${isPeak ? 'var(--gold)' : '#888'};font-weight:${isPeak ? '600' : '400'}">$${$(h.sales)} · ${h.count} ctas</span>
          </div>`;
        });
        const peak = bd.hourly_curve.reduce((a, b) => a.sales > b.sales ? a : b);
        html += `<div style="margin-top:6px;font-size:11px;color:#888">Peak: <strong style="color:var(--gold)">${peak.label}</strong> con $${$(peak.sales)}</div>`;
        html += `</div></div>`;
      }

      // Garzones: new format (per local) or legacy (combined)
      if (bd.garzones_bc1?.length || bd.garzones_bc2?.length) {

          if (!list?.length) return `<div class="kpi-card"><div class="kpi-label" style="color:${color}">${label} — Garzones</div><div style="color:#666;font-size:12px;padding:8px">Sin datos</div></div>`;
          let t = `<div class="kpi-card">

          });
          t += `</tbody></table></div>`;
          return t;
        };
        html += `<div class="dash-grid-2">`;
        html += renderGarzonTable(bd.garzones_bc1, 'BC1', 'var(--gold)');
        html += renderGarzonTable(bd.garzones_bc2, 'BC2', '#60a5fa');

      } else if (bd.garzones?.length) {

              <tbody>`;
        bd.garzones.forEach(g => {
          const badge = g.local === 'BC1' ? '<span style="background:var(--gold);color:#000;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;margin-right:4px">BC1</span>'
                      : g.local === 'BC2' ? '<span style="background:#3b82f6;color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;margin-right:4px">BC2</span>'
                      : '';
          html += `<tr><td>${g.rank}</td><td>${badge} ${g.name}</td><td>$${$(g.ventas)}</td><td>${g.cuentas}</td><td>$${$(g.ticket)}</td></tr>`;
        });
        // Totals per local
        const bc1t = bd.garzones.filter(g => g.local === 'BC1').reduce((s, g) => s + g.ventas, 0);
        const bc2t = bd.garzones.filter(g => g.local === 'BC2').reduce((s, g) => s + g.ventas, 0);
        const totalNote = bc1t && bc2t ? ` (BC1 $${$(bc1t)} + BC2 $${$(bc2t)})` : '';
        html += `</tbody></table>
          <div style="font-size:11px;color:#888;padding:4px 8px;text-align:right">Total: $${$(bc1t + bc2t)}${totalNote}</div>
          </div>`;

      html += `</div>`;

      // Medios de pago
      if (bd.medios_pago?.length) {

          </div>`;
