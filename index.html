<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BC Ops Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>

    :root {
      /* — Surfaces — */
      --bg: #080808;
      --surface: #0f0f0f;
      --card: #111111;
      --card-hover: #181818;
      --border: #1f1f1f;
      --border-hover: #2e2e2e;

      /* — Brand & state — */
      --gold: #D4A843;
      --gold-dim: rgba(212,168,67,0.15);
      --gold-glow: rgba(212,168,67,0.25);
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.12);
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.12);
      --yellow: #fbbf24;
      --yellow-dim: rgba(251,191,36,0.12);
      --orange: #fb923c;
      --orange-dim: rgba(251,146,60,0.12);
      --blue: #60a5fa;
      --blue-dim: rgba(96,165,250,0.12);

      /* — Text (semantic, WCAG AA min 4.6:1) — */
      --text-primary: #f2f2f2;     /* titles, KPI values */
      --text: #e0e0e0;             /* body, numeric values */
      --text-secondary: #b8b8b8;   /* metadata legible — replaces #999/#aaa */
      --text-tertiary: #888888;    /* timestamps, nominal labels — WCAG min */
      --text-dim: #c8c8c8;         /* secondary numeric */
      --text-muted: var(--text-secondary); /* legacy alias for compatibility */

      /* — Geometry — */
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 14px;

      /* — Typography — */
      --display: 'Syne', sans-serif;
      --sans: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --tabular: 'JetBrains Mono', monospace;

      /* — Motion — */
      --motion-fast: 150ms;
      --motion-base: 200ms;
      --motion-slow: 300ms;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-variant-numeric: tabular-nums;
    }

    /* Apply tabular-nums to data tables for column stability */
    .kpi-table, .garzon-table, .ec-item, .channel-row,
    .meta-value, .kpi-value, .kpi-sub, .review-count,
    .cr-checklist-row, .cr-detail-row, .cr-merma-detail {
      font-variant-numeric: tabular-nums;
    }

    /* Respect prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Dot grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #1e1e1e 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, transparent 40%, #080808 100%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 32px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    .logo-img {
      height: 44px;
      width: 44px;
      object-fit: contain;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .header-title { line-height: 1.1; }
    .header-title h1 {
      font-family: var(--display);
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    .header-title p {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .status-dot {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-secondary);
      min-height: 32px;
      padding: 0 4px;
    }
    .status-dot::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    .status-dot.error::before {
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
    }
    .timestamp-live {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-tertiary);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border-hover);
      color: var(--text-secondary);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      padding: 0 14px;
      min-height: 40px;
      min-width: 40px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color var(--motion-fast), color var(--motion-fast), background var(--motion-fast);
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(212,168,67,0.06); }
    .refresh-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .refresh-btn .icon-spin { display: inline-flex; transition: transform var(--motion-fast); }
    .refresh-btn.spinning .icon-spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Section header ── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-label {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .section-count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.4s ease both;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--card-accent, var(--border));
      transition: background 0.3s;
    }
    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .card:hover::before { background: var(--gold); }

    .card.status-success::before { background: var(--green); }
    .card.status-failure::before { background: var(--red); }
    .card.status-running::before { background: var(--yellow); animation: glow-yellow 1.5s ease-in-out infinite alternate; }
    @keyframes glow-yellow {
      from { box-shadow: 0 0 4px var(--yellow); }
      to   { box-shadow: 0 0 12px var(--yellow); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:nth-child(1) { animation-delay: 0.05s }
    .card:nth-child(2) { animation-delay: 0.10s }
    .card:nth-child(3) { animation-delay: 0.15s }
    .card:nth-child(4) { animation-delay: 0.20s }
    .card:nth-child(5) { animation-delay: 0.25s }
    .card:nth-child(6) { animation-delay: 0.30s }
    .card:nth-child(7) { animation-delay: 0.35s }
    .card:nth-child(8) { animation-delay: 0.40s }

    /* Card top */
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .card-icon {
      width: 38px; height: 38px;
      background: var(--card-hover);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--gold);
      flex-shrink: 0;
    }
    .card-icon svg { width: 18px; height: 18px; stroke-width: 1.75; }
    .card-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

    /* Badges */
    .badge {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .badge svg { width: 11px; height: 11px; stroke-width: 2; }
    .badge-cron    { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(212,168,67,0.2); }
    .badge-manual  { background: var(--card-hover); color: var(--text-secondary); border: 1px solid var(--border); }
    .badge-ok      { background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
    .badge-fail    { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
    .badge-running { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(251,191,36,0.2); }
    .badge-none    { background: var(--card-hover); color: var(--text-secondary); border: 1px solid var(--border); }
    .badge-cancelled { background: var(--card-hover); color: var(--text-secondary); border: 1px solid var(--border); }

    /* Card body */
    .card-name {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      letter-spacing: -0.2px;
    }
    .card-desc {
      font-family: var(--sans);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      font-weight: 400;
    }

    /* Card meta */
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .meta-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .meta-value {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
      text-align: right;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      justify-content: flex-end;
    }
    .meta-value svg { width: 12px; height: 12px; stroke-width: 1.75; }
    .meta-value a {
      color: var(--text-dim);
      text-decoration: none;
    }
    .meta-value a:hover { color: var(--gold); text-decoration: underline; }

    /* Card footer */
    .card-footer { display: flex; gap: 8px; }

    .btn-trigger {
      flex: 1;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      padding: 11px 14px;
      min-height: 44px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--motion-fast), color var(--motion-fast), transform var(--motion-fast);
      letter-spacing: 0.2px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-trigger svg { width: 14px; height: 14px; stroke-width: 2; }
    .btn-trigger:hover {
      background: var(--gold);
      color: #000;
    }
    .btn-trigger:active { transform: scale(0.98); }
    .btn-trigger:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn-trigger:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-trigger.loading {
      pointer-events: none;
      opacity: 0.7;
    }
    .btn-trigger .spinner {
      width: 13px; height: 13px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .btn-logs {
      background: transparent;
      border: 1px solid var(--border-hover);
      color: var(--text-secondary);
      font-family: var(--mono);
      font-size: 13px;
      padding: 0 12px;
      min-width: 44px;
      min-height: 44px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color var(--motion-fast), color var(--motion-fast);
      text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-logs:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .btn-logs:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn-logs svg { width: 14px; height: 14px; stroke-width: 1.75; }

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, #111 25%, #181818 50%, #111 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 4px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .card-skeleton .card-name { height: 16px; width: 70%; }
    .card-skeleton .card-desc { height: 11px; width: 90%; margin-top: 8px; }
    .card-skeleton .card-desc + .card-desc { width: 65%; margin-top: 4px; }
    .card-skeleton .btn-trigger { height: 36px; border: none; background: #181818; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #111;
      border: 1px solid var(--border-hover);
      border-radius: 14px;
      width: 100%; max-width: 420px;
      padding: 28px;
      transform: translateY(16px) scale(0.97);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-icon {
      width: 44px; height: 44px;
      background: var(--gold-dim);
      border: 1px solid rgba(212,168,67,0.2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: var(--gold);
    }
    .modal-icon svg { width: 22px; height: 22px; stroke-width: 1.75; }
    .modal-close {
      background: transparent; border: none;
      color: var(--text-secondary); cursor: pointer;
      width: 40px; height: 40px;
      border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: color var(--motion-fast), background var(--motion-fast);
      line-height: 1;
    }
    .modal-close svg { width: 18px; height: 18px; stroke-width: 2; }
    .modal-close:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
    .modal-close:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .modal h2 {
      font-family: var(--sans);
      font-size: 18px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 6px; letter-spacing: -0.3px;
    }
    .modal p {
      font-family: var(--sans);
      font-size: 14px; color: var(--text-secondary);
      line-height: 1.5;
    }

    .form-group { margin-top: 22px; }
    .form-group label {
      display: block;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .form-group input[type="date"] {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid var(--border-hover);
      border-radius: 8px;
      padding: 12px 14px;
      min-height: 44px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      outline: none;
      transition: border-color var(--motion-fast);
      color-scheme: dark;
    }
    .form-group input[type="date"]:focus { border-color: var(--gold); }
    .form-hint {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 6px;
    }

    .modal-actions {
      display: flex; gap: 10px; margin-top: 24px;
    }
    .btn-cancel {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border-hover);
      color: var(--text-secondary);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      padding: 12px;
      min-height: 44px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color var(--motion-fast), color var(--motion-fast);
    }
    .btn-cancel:hover { border-color: var(--text-secondary); color: var(--text-primary); }
    .btn-cancel:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn-confirm {
      flex: 2;
      background: var(--gold);
      border: none;
      color: #000;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      min-height: 44px;
      border-radius: 8px;
      cursor: pointer;
      transition: background var(--motion-fast);
      display: flex; align-items: center; justify-content: center; gap: 7px;
      letter-spacing: 0.2px;
    }
    .btn-confirm svg { width: 14px; height: 14px; stroke-width: 2.25; }
    .btn-confirm:hover { background: #e6b84a; }
    .btn-confirm:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
    .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-confirm .spinner {
      width: 14px; height: 14px;
      border: 2px solid #000;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 28px; right: 28px;
      display: flex; flex-direction: column; gap: 10px;
      z-index: 200;
    }
    .toast {
      background: #1a1a1a;
      border: 1px solid var(--border-hover);
      border-left: 3px solid var(--green);
      border-radius: 8px;
      padding: 12px 16px;
      min-width: 280px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .toast.error { border-left-color: var(--red); }
    .toast strong { display: block; margin-bottom: 2px; color: #fff; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(20px); }
    }

    /* ── Section groups ── */
    .section-group { margin-bottom: 48px; }
    .section-group:last-child { margin-bottom: 0; }
    .section-pill {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 10px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 20px;
    }
    .pill-diario   { background: rgba(74,222,128,0.1);  color: var(--green);  border: 1px solid rgba(74,222,128,0.25); }
    .pill-semanal  { background: rgba(96,165,250,0.1);  color: var(--blue);   border: 1px solid rgba(96,165,250,0.25); }
    .pill-mensual  { background: rgba(212,168,67,0.12); color: var(--gold);   border: 1px solid rgba(212,168,67,0.25); }
    .pill-desactivado { background: rgba(255,255,255,0.04); color: #555; border: 1px solid #222; }
    .section-pill::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
    }
    .pill-diario::before   { box-shadow: 0 0 5px var(--green); animation: pulse-dot 2s ease-in-out infinite; }
    .section-divider {
      border: none; border-top: 1px solid var(--border);
      margin: 0 0 40px;
    }

    /* ── Error state ── */
    .error-state {
      text-align: center;
      padding: 60px 20px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-muted);
    }
    .error-state p { margin-top: 8px; font-size: 11px; color: var(--red); }
  

    /* ── Navigation Tabs ── */
    .nav-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 5px;
      width: fit-content;
    }
    .nav-tab {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 22px;
      min-height: 40px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color var(--motion-fast), background var(--motion-fast), border-color var(--motion-fast);
      letter-spacing: 0.2px;
    }
    .nav-tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
    .nav-tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .nav-tab.active {
      background: var(--gold-dim);
      color: var(--gold);
      border-color: rgba(212,168,67,0.25);
    }
    @media (max-width: 600px) {
      .nav-tabs { width: 100%; }
      .nav-tab { flex: 1; padding: 12px 16px; }
    }

    /* ── Dashboard ── */
    #dashboard-view { display: block; }
    #workflows-view { display: none; }

    .dash-section {
      margin-bottom: 32px;
    }
    .dash-section-title {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .dash-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .dash-grid-2 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 768px) {
      .dash-grid-3, .dash-grid-2 { grid-template-columns: 1fr; }
    }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      transition: border-color var(--motion-fast);
    }
    .kpi-card:hover { border-color: var(--border-hover); }
    .kpi-card.gold-accent { border-left: 3px solid var(--gold); }
    .kpi-card.green-accent { border-left: 3px solid var(--green); }
    .kpi-card.red-accent { border-left: 3px solid var(--red); }
    .kpi-card.blue-accent { border-left: 3px solid var(--blue); }

    .kpi-label {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .kpi-label svg { width: 12px; height: 12px; stroke-width: 1.75; }
    .kpi-value {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
    }
    .kpi-value.gold { color: var(--gold); }
    .kpi-value.green { color: var(--green); }
    .kpi-value.red { color: var(--red); }
    .kpi-sub {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
      line-height: 1.5;
    }
    .kpi-sub span { color: var(--text-dim); }

    .kpi-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 5px;
      margin-left: 8px;
    }
    .kpi-badge svg { width: 11px; height: 11px; stroke-width: 2.5; }
    .kpi-badge.up { background: var(--green-dim); color: var(--green); }
    .kpi-badge.down { background: var(--red-dim); color: var(--red); }
    .kpi-badge.neutral { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

    /* Channel bars */
    .channel-bar-wrap { margin-top: 12px; }
    .channel-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .channel-label {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-secondary);
      width: 78px;
      text-align: right;
    }
    .channel-bar {
      flex: 1;
      height: 18px;
      background: rgba(255,255,255,0.04);
      border-radius: 5px;
      overflow: hidden;
    }
    .channel-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.6s ease;
    }
    .channel-fill.gold { background: var(--gold); opacity: 0.75; }
    .channel-fill.blue { background: var(--blue); opacity: 0.75; }
    .channel-fill.green { background: var(--green); opacity: 0.75; }
    .channel-pct {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-dim);
      min-width: 50px;
    }

    /* Reviews card */
    .review-platform {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .review-platform:last-child { border-bottom: none; }
    .review-stars {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      letter-spacing: 0;
    }
    .review-stars svg { width: 12px; height: 12px; }
    .review-stars .star-filled { color: var(--gold); }
    .review-stars .star-empty { color: var(--border-hover); }
    .review-count {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Weekly KPI mini table */
    .kpi-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 13px;
    }
    .kpi-table th {
      color: var(--text-secondary);
      font-weight: 600;
      text-align: left;
      padding: 8px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-table td {
      padding: 7px 8px;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .kpi-table .val-up { color: var(--green); font-weight: 600; }
    .kpi-table .val-down { color: var(--red); font-weight: 600; }
    .kpi-table .val-neutral { color: var(--text-dim); }

    /* Alert list (only for true alerts; positives use .positive-item) */
    .alert-item, .positive-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      margin-bottom: 6px;
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.4;
    }
    .alert-item svg, .positive-item svg { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
    .alert-item.alert-red    { background: var(--red-dim);    color: var(--red);    border-left: 3px solid var(--red); }
    .alert-item.alert-yellow { background: var(--yellow-dim); color: var(--yellow); border-left: 3px solid var(--yellow); }
    .alert-item.alert-orange { background: var(--orange-dim); color: var(--orange); border-left: 3px solid var(--orange); }
    .positive-item           { background: var(--green-dim);  color: var(--green);  border-left: 3px solid var(--green); }
    .alert-group-title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 14px 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .alert-group-title svg { width: 14px; height: 14px; stroke-width: 2; }
    .alert-group-title.danger  { color: var(--red); }
    .alert-group-title.success { color: var(--green); }

    /* Dashboard loading */
    .dash-loading {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
    }
    .dash-error {
      text-align: center;
      padding: 40px;
      color: var(--red);
      font-family: var(--mono);
      font-size: 12px;
    }

    /* No data state */
    .no-data {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 16px;
      text-align: center;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* ── Meta Mensual Progress ── */
    .meta-progress-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .meta-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .meta-progress-bar {
      width: 100%;
      height: 22px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .meta-progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.8s ease;
    }
    .meta-progress-marker {
      position: absolute;
      top: 0;
      height: 100%;
      width: 2px;
      background: rgba(255,255,255,0.3);
    }
    .meta-progress-marker-label {
      position: absolute;
      top: -16px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-muted);
      transform: translateX(-50%);
    }

    /* ── Score Operacional ── */
    .score-gauge {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .score-ring {
      width: 100px;
      height: 100px;
      position: relative;
    }
    .score-ring svg.score-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .score-ring-value {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      line-height: 1;
    }
    .score-ring-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .score-ring-denom {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 3px;
      letter-spacing: 0.5px;
    }
    .score-tooltip {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 8px;
      cursor: help;
      border-bottom: 1px dashed var(--border-hover);
      padding-bottom: 1px;
    }
    .score-components {
      display: flex;
      gap: 18px;
      margin-top: 14px;
    }
    .score-comp {
      text-align: center;
    }
    .score-comp-val {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 700;
    }
    .score-comp-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* ── Sparkline (Trends 7d) ── */
    .spark-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .spark-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .spark-svg {
      width: 100%;
      height: 80px;
    }
    .spark-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }
    .spark-label {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-muted);
    }

    /* ── CheckRocket Cards v2 ── */
    .cr-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .cr-score-big {
      font-family: var(--mono);
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
    }
    .cr-score-total {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .cr-cat-title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin: 14px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .cr-cat-title svg { width: 14px; height: 14px; stroke-width: 1.75; color: var(--gold); }
    .cr-checklist-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--text);
      gap: 8px;
    }
    .cr-checklist-row .cr-name { flex: 1; }
    .cr-badge-ok, .cr-badge-fail, .cr-badge-warn {
      padding: 3px 9px;
      border-radius: 12px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .cr-badge-ok svg, .cr-badge-fail svg, .cr-badge-warn svg { width: 11px; height: 11px; stroke-width: 2.25; }
    .cr-badge-ok   { background: rgba(74,222,128,0.12); color: var(--green);  border: 1px solid rgba(74,222,128,0.25); }
    .cr-badge-fail { background: rgba(248,113,113,0.12); color: var(--red);   border: 1px solid rgba(248,113,113,0.25); }
    .cr-badge-warn { background: rgba(251,146,60,0.12); color: var(--orange); border: 1px solid rgba(251,146,60,0.25); }
    .cr-detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-dim);
    }
    .cr-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .cr-alert-box {
      background: rgba(248,113,113,0.06);
      border: 1px solid rgba(248,113,113,0.22);
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 10px;
      font-family: var(--sans);
      font-size: 13px;
    }
    .cr-alert-box.warn {
      background: rgba(251,146,60,0.06);
      border-color: rgba(251,146,60,0.22);
    }
    .cr-merma-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 10px;
    }
    .cr-merma-prod {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .cr-merma-detail {
      font-family: var(--sans);
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ── Garzones table ── */
    .garzon-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 13px;
    }
    .garzon-table th {
      color: var(--text-secondary);
      font-weight: 600;
      text-align: left;
      padding: 8px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .garzon-table td {
      padding: 7px 8px;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .garzon-table tr:first-child td { color: var(--gold); font-weight: 600; }

    /* ── Estimado Compra ── */
    .ec-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-family: var(--mono);
      font-size: 13px;
    }
    .ec-item:last-child { border-bottom: none; }
    .ec-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .ec-urgente { background: var(--red-dim); color: var(--red); }
    .ec-normal { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

    /* ── Tooltip generic ── */
    [data-tooltip] { position: relative; }
    [data-tooltip]:hover::after,
    [data-tooltip]:focus-visible::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: var(--text-primary);
      border: 1px solid var(--border-hover);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.4;
      white-space: pre-line;
      max-width: 240px;
      width: max-content;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <header>
    <div class="header-left">
      <img src="/logo.png" alt="BlackChicken" class="logo-img">
      <div class="header-title">
        <h1>OPS HUB</h1>
        <p>DASHBOARD OPERACIONAL</p>
      </div>
    </div>
    <div class="header-right">
      <span class="timestamp-live" id="timestamp-live" aria-live="polite" title="Última carga del dashboard"></span>
      <div class="status-dot" id="status-text" aria-live="polite">Conectado</div>
      <button class="refresh-btn" onclick="refreshAll()" id="refresh-btn" aria-label="Refrescar datos">
        <span class="icon-spin" id="icon-refresh" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </span>
        Refrescar
      </button>
    </div>
  </header>

  <!-- Navigation tabs -->
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-dashboard" onclick="switchView('dashboard')">Dashboard</button>
    <button class="nav-tab" id="tab-workflows" onclick="switchView('workflows')">Workflows</button>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view">
    <div class="dash-loading" id="dash-loading">Cargando datos operacionales...</div>
    <div id="dash-content" style="display:none"></div>
  </div>

  <!-- WORKFLOWS VIEW (existing) -->
  <div id="workflows-view" style="display:none">
    <div id="sections-container">
      <div class="section-header">
        <span class="section-label">WORKFLOWS</span>
        <span class="section-count" id="wf-count">cargando...</span>
      </div>
      <div class="grid">
        <div class="card card-skeleton">
          <div class="card-top"><div class="skeleton" style="width:36px;height:36px;border-radius:8px"></div></div>
          <div class="card-name skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-footer"><div class="btn-trigger skeleton"></div></div>
        </div>
        <div class="card card-skeleton">
          <div class="card-top"><div class="skeleton" style="width:36px;height:36px;border-radius:8px"></div></div>
          <div class="card-name skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-footer"><div class="btn-trigger skeleton"></div></div>
        </div>
        <div class="card card-skeleton">
          <div class="card-top"><div class="skeleton" style="width:36px;height:36px;border-radius:8px"></div></div>
          <div class="card-name skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-desc skeleton"></div>
          <div class="card-footer"><div class="btn-trigger skeleton"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal trigger -->
<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-icon" id="modal-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <button class="modal-close" onclick="closeModal()" aria-label="Cerrar modal">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <h2 id="modal-title">Ejecutar workflow</h2>
    <p id="modal-desc">Dispara el workflow manualmente.</p>

    <div class="form-group" id="date-group">
      <label for="date-input">Fecha (opcional)</label>
      <input type="date" id="date-input" />
      <div class="form-hint">Vacío = ayer (comportamiento por defecto)</div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" id="btn-confirm" onclick="confirmTrigger()">
        <span id="confirm-text">

</div>

  };

  function renderStars(rating, max=5) {
    const r = Math.round(Number(rating) || 0);
    let s = '';
    for (let i=0; i<max; i++) {
      s += i < r ? `<span class="star-filled" aria-hidden="true">${ICON.star}</span>` : `<span class="star-empty" aria-hidden="true">${ICON.starOutline}</span>`;
    }
    return `<span class="review-stars" role="img" aria-label="${r} de ${max} estrellas">${s}</span>`;
  }

  function maskName(name) {
    if (!name) return '?';
    const trimmed = String(name).trim();
    const parts = trimmed.split(/\s+/);
    if (parts.length === 1) return parts[0];
    // First name + initial of last name
    return `${parts[0]} ${parts[parts.length-1].charAt(0).toUpperCase()}.`;
  }

  // ── View switching ─────────────────────────────────────────────────
  function switchView(view) {
    document.getElementById('dashboard-view').style.display = view === 'dashboard' ? 'block' : 'none';
    document.getElementById('workflows-view').style.display = view === 'workflows' ? 'block' : 'none';
    document.getElementById('tab-dashboard').classList.toggle('active', view === 'dashboard');
    document.getElementById('tab-workflows').classList.toggle('active', view === 'workflows');
    if (view === 'workflows' && !workflowsLoaded) loadWorkflows();
  }

  function refreshAll() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    loadDashboard();
    loadWorkflows();
    setTimeout(() => btn.classList.remove('spinning'), 2000);
  }

  // ── Live timestamp (re-renders every 30s without refetching) ─────────
  let _lastTimestampISO = null;
  function setLiveTimestamp(iso) {
    if (iso) _lastTimestampISO = iso;
    const el = document.getElementById('timestamp-live');
    if (!el || !_lastTimestampISO) return;
    const ago = Math.round((Date.now() - new Date(_lastTimestampISO).getTime()) / 60000);
    let txt;
    if (ago < 1) txt = 'Actualizado: ahora';
    else if (ago < 60) txt = `Actualizado: hace ${ago} min`;
    else txt = `Actualizado: hace ${Math.round(ago/60)}h`;
    el.textContent = txt;
  }
  setInterval(() => setLiveTimestamp(), 30000);

  let workflowsLoaded = false;

  // ── DASHBOARD ──────────────────────────────────────────────────────

  async function loadDashboard() {
    const loading = document.getElementById('dash-loading');
    const content = document.getElementById('dash-content');
    loading.style.display = 'block';
    content.style.display = 'none';

    try {
      const resp = await fetch('/api/dashboard');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      renderDashboard(data);
      loading.style.display = 'none';
      content.style.display = 'block';
    } catch (err) {
      loading.innerHTML = `<div class="dash-error">Error cargando dashboard: ${err.message}</div>`;
    }
  }

  function $(n) { return n != null ? n.toLocaleString('es-CL') : '—'; }
  function pct(n) { return n != null ? n.toFixed(1) + '%' : '—'; }
  function fmtDate(s) { if (!s) return s; const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; const p = s.split('-'); return p.length === 3 ? `${parseInt(p[2])} ${meses[parseInt(p[1])-1]}` : s; }

  function renderDashboard(data) {
    const el = document.getElementById('dash-content');
    const d = data.daily;
    const g = data.google_reviews;
    const u = data.uber_reviews;
    const w = data.weekly;
    const cr = data.checkrocket;
    const bd = data.briefing_detail;
    const tr = data.trends;
    const mm = data.meta_mensual;
    const sc = data.score_operacional;
    const ec = data.estimado_compra;

    let html = '';

    // Timestamp now lives in header (#timestamp-live), updated live every 30s
    if (data.timestamp) {
      setLiveTimestamp(data.timestamp);
    }

    // ── Section 0: Score Operacional + Meta Mensual (top row) ──
    html += `<div class="dash-section"><div class="dash-grid" style="grid-template-columns: 260px 1fr; gap: 16px;">`;

    // Score gauge
    if (sc && sc.total != null) {
      const scoreColor = sc.total >= 85 ? 'var(--green)' : sc.total >= 65 ? 'var(--gold)' : 'var(--red)';
      const scoreLabel = sc.total >= 85 ? 'Sobre lo esperado' : sc.total >= 65 ? 'En margen' : 'Bajo lo esperado';
      const pctVal = Math.min(sc.total, 100);
      const circumference = 2 * Math.PI * 42;
      const offset = circumference - (pctVal / 100) * circumference;
      const tooltipText = `Promedio ponderado de:\n• Ventas (40%) ≥100% = verde\n• CheckRocket (35%) ≥85% = verde\n• Reviews (25%) ≥80% = verde\nUmbrales: ≥85 verde · 65–84 ámbar · <65 rojo`;
      html += `
        <div class="kpi-card" style="text-align:center">
          <div class="kpi-label">Score Operacional</div>
          <div class="score-gauge">
            <div class="score-ring">
              <svg class="score-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/>
                <circle cx="50" cy="50" r="42" fill="none" stroke="${scoreColor}" stroke-width="6"
                  stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
                  stroke-linecap="round" style="transition:stroke-dashoffset 1s ease"/>
              </svg>
              <div class="score-ring-value">
                <span class="score-ring-num" style="color:${scoreColor}">${sc.total}</span>
                <span class="score-ring-denom">/ 100</span>
              </div>
            </div>
            <div class="score-tooltip" data-tooltip="${tooltipText}" tabindex="0" role="button" aria-label="Ver fórmula del score">
              ${scoreLabel} · ¿cómo se calcula?
            </div>
            <div class="score-components">
              ${sc.components?.ventas ? `<div class="score-comp"><div class="score-comp-val" style="color:${sc.components.ventas.value >= 100 ? 'var(--green)' : 'var(--red)'}">${Math.round(sc.components.ventas.value)}%</div><div class="score-comp-label">Ventas</div></div>` : ''}
              ${sc.components?.checkrocket ? `<div class="score-comp"><div class="score-comp-val" style="color:${sc.components.checkrocket.value >= 85 ? 'var(--green)' : 'var(--gold)'}">${sc.components.checkrocket.value}%</div><div class="score-comp-label">CheckR</div></div>` : ''}
              ${sc.components?.reviews ? `<div class="score-comp"><div class="score-comp-val" style="color:${sc.components.reviews.value >= 80 ? 'var(--green)' : 'var(--red)'}">${sc.components.reviews.value}%</div><div class="score-comp-label">Reviews</div></div>` : ''}
            </div>
          </div>
        </div>`;
    } else {
      html += `<div class="kpi-card"><div class="kpi-label">Score Operacional</div><div class="no-data" style="border:none;background:none">Sin datos</div></div>`;
    }

    // Meta mensual progress
    if (mm) {
      const acumPct = mm.acumulado_pct || 0;
      const dayPct = ((mm.dia_actual / mm.dias_mes) * 100).toFixed(0);
      const fillColor = acumPct >= parseFloat(dayPct) ? 'var(--green)' : acumPct >= parseFloat(dayPct) * 0.85 ? 'var(--gold)' : 'var(--red)';
      const acumM = mm.acumulado_monto ? (mm.acumulado_monto / 1e6).toFixed(1) : '?';
      const metaM = (mm.meta_total / 1e6).toFixed(0);
      const onTrack = acumPct >= parseFloat(dayPct);
      const trackIcon = onTrack ? ICON.arrowUp : ICON.arrowDown;
      const trackLabel = onTrack ? 'Sobre ritmo' : 'Bajo ritmo';
      html += `
        <div class="kpi-card">
          <div class="meta-progress-header">
            <div class="kpi-label">Meta Mensual — $${metaM}M</div>
            <div class="kpi-sub" style="margin:0"><span style="color:${fillColor};font-weight:600">$${acumM}M</span> acumulado (${pct(acumPct)})</div>
          </div>
          <div class="meta-progress-bar" style="position:relative">
            <div class="meta-progress-fill" style="width:${Math.min(acumPct, 100)}%;background:${fillColor}"></div>
            <div class="meta-progress-marker" style="left:${dayPct}%">
              <div class="meta-progress-marker-label">Día ${mm.dia_actual}/${mm.dias_mes}</div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:12px;align-items:center;flex-wrap:wrap;gap:8px">
            <div class="kpi-sub" style="margin:0">BC1: $${(mm.meta_bc1/1e6).toFixed(0)}M</div>
            <div class="kpi-sub" style="margin:0">BC2: $${(mm.meta_bc2/1e6).toFixed(0)}M</div>
            <div class="kpi-sub" style="margin:0;display:inline-flex;align-items:center;gap:5px;color:${onTrack ? 'var(--green)' : 'var(--red)'};font-weight:600">${trackIcon} ${trackLabel}</div>
          </div>
          ${mm.projected ? `<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">
            <div class="kpi-sub" style="margin-bottom:4px"><span style="color:${mm.will_hit_meta ? 'var(--green)' : 'var(--red)'};font-weight:600">Proyección: $${(mm.projected/1e6).toFixed(1)}M</span> <span style="color:var(--text-secondary)">(${mm.projected_pct}% de meta)</span></div>
            <div style="font-size:12px;color:var(--text-tertiary);font-family:var(--mono)">Al ritmo actual llegarías a $${(mm.projected/1e6).toFixed(1)}M</div>
          </div>` : ''}
        </div>`;
    } else {
      html += `<div class="kpi-card"><div class="kpi-label">Meta Mensual</div><div class="no-data" style="border:none;background:none">Sin datos</div></div>`;
    }

    html += `</div></div>`;

    // ── Section 1: Ventas del día ──
    if (d) {
      const metaBadge = d.meta_diaria_pct >= 100 ? 'up' : d.meta_diaria_pct >= 85 ? 'neutral' : 'down';
      const metaIcon = d.meta_diaria_pct >= 100 ? ICON.arrowUp : d.meta_diaria_pct >= 85 ? ICON.minus : ICON.arrowDown;

      const deltaBadge = bd?.delta_ventas_pct ? (bd.delta_ventas_pct >= 0 ? 'up' : 'down') : '';
      const deltaIcon = bd?.delta_ventas_pct ? (bd.delta_ventas_pct >= 0 ? ICON.arrowUp : ICON.arrowDown) : '';
      const deltaText = bd?.delta_ventas_pct && bd?.prev_day_label ? `${bd.delta_ventas_pct >= 0 ? '+' : ''}${bd.delta_ventas_pct.toFixed(1)}% vs ${bd.prev_day_label}` : '';

      html += `
        <div class="dash-section">
          <div class="dash-section-title">Ventas del día ${d.fecha ? '— ' + d.fecha : ''}</div>
          <div class="dash-grid" style="grid-template-columns: 1.4fr 1fr 1fr;">
            <div class="kpi-card gold-accent">
              <div class="kpi-label">Ventas Totales</div>
              <div class="kpi-value gold">$${$(d.ventas_total)}</div>
              <div class="kpi-sub" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
                <span>${pct(d.meta_pct)} de meta mensual</span>
                <span class="kpi-badge ${metaBadge}">${metaIcon} ${pct(d.meta_diaria_pct)} meta diaria</span>
                ${deltaText ? `<span class="kpi-badge ${deltaBadge}">${deltaIcon} ${deltaText}</span>` : ''}
              </div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">BC1 — El Plomo 5931</div>
              <div class="kpi-value">$${$(d.bc1?.ventas)}</div>
              <div class="kpi-sub">${$(d.bc1?.cuentas)} cuentas · ticket $${$(d.bc1?.ticket)}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">BC2 — El Plomo 5630</div>
              <div class="kpi-value">$${$(d.bc2?.ventas)}</div>
              <div class="kpi-sub">${$(d.bc2?.cuentas)} cuentas · ticket $${$(d.bc2?.ticket)}</div>
            </div>
          </div>
        </div>`;

      // ── Section 1b: Tendencias 7 días ──
      if (tr && tr.length > 1) {
        const vals = tr.map(t => t.ventas || 0);
        const maxV = Math.max(...vals, 1);
        const minV = Math.min(...vals);
        const w = 600, h = 70, pad = 4;
        const step = (w - pad * 2) / (vals.length - 1);
        const points = vals.map((v, i) => {
          const x = pad + i * step;
          const y = h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad * 2);
          return `${x},${y}`;
        }).join(' ');

        const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
        const avgY = h - pad - ((avg - minV) / (maxV - minV || 1)) * (h - pad * 2);

        // Calculate average ticket from trends data
        const totalVentas = vals.reduce((a, b) => a + b, 0);
        const totalCuentas = tr.reduce((sum, t) => sum + (t.cuentas || 0), 0);
        const avgTicket = totalCuentas > 0 ? Math.round(totalVentas / totalCuentas) : null;

        html += `
        <div class="dash-section">
          <div class="spark-wrap">
            <div class="spark-header">
              <div class="kpi-label" style="margin:0">Tendencia 7 Días</div>
              <div class="kpi-sub" style="margin:0">Prom: <span style="color:var(--gold)">$${$(Math.round(avg))}</span>${avgTicket ? ` · Ticket: <span style="color:#888">$${$(avgTicket)}</span>` : ''}
                <span style="margin-left:12px;font-size:9px;color:#555">
                  <span style="color:rgba(212,168,67,0.5)">━</span> BC1
                  <span style="color:rgba(96,165,250,0.5);margin-left:6px">━</span> BC2
                </span>
              </div>
            </div>
            <svg class="spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
              <line x1="${pad}" y1="${avgY}" x2="${w-pad}" y2="${avgY}" stroke="rgba(212,168,67,0.2)" stroke-width="1" stroke-dasharray="4"/>
              ${(() => {
                // BC1 sub-line (gold, thin)
                const bc1Vals = tr.map(t => t.bc1 || 0);
                const bc1Pts = bc1Vals.map((v, i) => `${pad + i * step},${h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad * 2)}`).join(' ');
                // BC2 sub-line (blue, thin)
                const bc2Vals = tr.map(t => t.bc2 || 0);
                const bc2Pts = bc2Vals.map((v, i) => `${pad + i * step},${h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad * 2)}`).join(' ');
                const hasSub = bc1Vals.some(v => v > 0) && bc2Vals.some(v => v > 0);
                return hasSub ? `<polyline points="${bc1Pts}" fill="none" stroke="rgba(212,168,67,0.35)" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3"/>
                <polyline points="${bc2Pts}" fill="none" stroke="rgba(96,165,250,0.35)" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3"/>` : '';
              })()}
              <polyline points="${points}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>
              ${vals.map((v, i) => {
                const bc1v = tr[i]?.bc1; const bc2v = tr[i]?.bc2;
                const tip = `$${$(v)}${bc1v ? ' (BC1 $' + $(bc1v) + ')' : ''}${bc2v ? ' (BC2 $' + $(bc2v) + ')' : ''}`;
                const x = pad + i * step;
                const y = h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad * 2);
                return `<circle cx="${x}" cy="${y}" r="4" fill="var(--gold)" stroke="var(--bg)" stroke-width="1.5"><title>${tip}</title></circle>`;
              }).join('')}
            </svg>
            <div class="spark-labels">
              ${tr.map(t => {
                const f = t.fecha || '';
                const m = f.match(/(\d{1,2})\s+de\s+(\w+)/);
                const lbl = m ? m[1] + ' ' + m[2].substring(0,3) : f.split(' ').pop() || '';
                return `<span class="spark-label">${lbl}</span>`;
              }).join('')}
            </div>
          </div>
        </div>`;
      }

      // ── Section 2: Canales ──
      if (d.canales) {
        html += `
        <div class="dash-section">
          <div class="dash-section-title">CANALES</div>
          <div class="dash-grid-2">
            <div class="kpi-card">
              <div class="kpi-label">Por plataforma</div>
              <div class="channel-bar-wrap">
                ${channelBar('POS', d.canales.pos, 'gold')}
                ${channelBar('UberEats', d.canales.uber, 'blue')}
                ${channelBar('Justo', d.canales.justo, 'green')}
              </div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Por tipo de venta</div>
              <div class="channel-bar-wrap">
                ${d.tipo_venta ? channelBar('Mesa', d.tipo_venta.mesa, 'gold') : ''}
                ${d.tipo_venta ? channelBar('Delivery', d.tipo_venta.delivery, 'blue') : ''}
                ${d.tipo_venta ? channelBar('Retiro', d.tipo_venta.retiro, 'green') : ''}
              </div>
            </div>
          </div>
        </div>`;
      }

      // ── Section 3: Estado del día (alertas vs logros, separados) ──
      const hasAnulacionAlert = (d.cancelled_count > 5) || (d.cancel_total > 100000);
      const hasAlerts = d.alertas.length || hasAnulacionAlert;
      const hasPositive = d.positivo.length;
      if (hasAlerts || hasPositive) {
        html += `<div class="dash-section"><div class="dash-section-title">Estado del día</div>`;
        if (hasAlerts) {
          html += `<div class="alert-group-title danger">${ICON.alertTriangle} Atención</div>`;
          if (hasAnulacionAlert) {
            const anulMsg = `Anulaciones: ${d.cancelled_count ? d.cancelled_count + ' órdenes' : ''} ${d.cancel_total ? '($' + $(d.cancel_total) + ')' : ''}`.trim();
            html += `<div class="alert-item alert-orange">${ICON.alertTriangle}<span>${anulMsg}</span></div>`;
          }
          d.alertas.forEach(a => {
            html += `<div class="alert-item alert-red">${ICON.alertOctagon}<span>${a}</span></div>`;
          });
        }
        if (hasPositive) {
          html += `<div class="alert-group-title success">${ICON.checkCircle} Bien</div>`;
          d.positivo.forEach(p => {
            html += `<div class="positive-item">${ICON.checkCircle}<span>${p}</span></div>`;
          });
        }
        html += `</div>`;
      }
    } else {
      html += `<div class="no-data">Sin datos de briefing disponibles</div>`;
    }

    // ── Section 4: CheckRocket (v2 — por checklist) ──
    if (cr && (cr.bc1 || cr.bc2)) {
      html += `
      <div class="dash-section">
        <div class="dash-section-title">CHECKROCKET — CUMPLIMIENTO OPERACIONAL</div>
        <div class="dash-grid-2">`;

      ['bc1', 'bc2'].forEach((loc, idx) => {
        const c = cr[loc];
        if (!c) return;
        const label = idx === 0 ? 'BC1 — El Plomo 5931' : 'BC2 — El Plomo 5630';
        const pct = c.score_pct ?? (c.completed && c.total ? Math.round(c.completed/c.total*100*10)/10 : null);
        const scoreColor = pct >= 90 ? 'var(--green)' : pct >= 70 ? 'var(--gold)' : 'var(--red)';
        const accentClass = pct >= 90 ? 'green-accent' : pct >= 70 ? '' : 'red-accent';

        // Group checklists by category
        const cats = {cocina: [], salon: [], jefaturas: [], periodicos: []};
        (c.checklists || []).forEach(cl => {
          if (cats[cl.category]) cats[cl.category].push(cl);
          else cats.cocina.push(cl);
        });

        const realizados = (c.checklists || []).filter(cl => cl.status === 'realizado').length;
        const noRealizados = (c.checklists || []).filter(cl => cl.status === 'no_realizado').length;

        html += `
          <div class="cr-card ${accentClass}">
            <div class="kpi-label">${label}${c.jefe_local ? ` · Jefe: ${c.jefe_local}` : ''}</div>
            <div style="display:flex;align-items:baseline;gap:6px;margin:8px 0">
              <span class="cr-score-big" style="color:${scoreColor}">${pct ?? '?'}%</span>
              <span class="cr-score-total">${c.completed ?? realizados} / ${c.total ?? (realizados + noRealizados)}</span>
            </div>`;

        // Render checklists by category
        const catLabels = {
          cocina:     { txt: 'Cocina',     icon: ICON.chefHat },
          salon:      { txt: 'Salón',      icon: ICON.utensils },
          jefaturas:  { txt: 'Jefaturas',  icon: ICON.clipboard },
          periodicos: { txt: 'Periódicos', icon: ICON.repeat }
        };
        for (const [cat, items] of Object.entries(cats)) {
          if (!items.length) continue;
          const meta = catLabels[cat];
          html += `<div class="cr-cat-title">${meta.icon}${meta.txt}</div>`;
          items.forEach(cl => {
            const isOk = cl.status === 'realizado';
            let badgeCls = 'cr-badge-ok';
            let badgeIcon = ICON.check;
            let badgeTxt = 'Realizado';
            if (!isOk) {
              badgeCls = 'cr-badge-fail';
              badgeIcon = ICON.x;
              badgeTxt = 'No realizado';
            } else if (cl.badge && (cl.badge.includes('Incompleto') || cl.badge.includes('Alertas'))) {
              badgeCls = 'cr-badge-warn';
              badgeIcon = ICON.alertTriangle;
              badgeTxt = cl.badge.replace(/^[^\w]+\s*/, ''); // strip leading emoji if any
            } else if (cl.badge && cl.badge !== '✅ OK' && cl.badge !== '100%') {
              badgeTxt = cl.badge.replace(/^[^\w]+\s*/, '');
            }
            html += `<div class="cr-checklist-row"><span class="cr-name">${cl.name || 'Sin nombre'}</span><span class="${badgeCls}">${badgeIcon}${badgeTxt}</span></div>`;
          });
        }

        // Temps fuera de rango
        if (c.temps_fuera?.length) {
          html += `<div class="cr-alert-box">
            <div style="color:var(--red);font-weight:600;margin-bottom:8px;display:inline-flex;align-items:center;gap:6px">${ICON.alertOctagon} Temperaturas fuera de rango</div>`;
          c.temps_fuera.forEach(t => {
            html += `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:var(--text-primary)">${t.equipo}</span><span style="color:var(--red);font-weight:600;font-family:var(--mono)">${t.temp}</span></div>`;
          });
          html += `</div>`;
        }
        if (c.temps_limite?.length) {
          html += `<div style="margin-top:8px;font-size:13px;color:var(--text-secondary);display:inline-flex;align-items:flex-start;gap:6px;line-height:1.5">${ICON.alertTriangle}<span>En límite: ${c.temps_limite.map(t => `${t.equipo} (${t.temp})`).join(', ')}</span></div>`;
        }

        // No Cumple detalle
        if (c.no_cumple?.length) {
          html += `<div class="cr-alert-box warn">
            <div style="color:var(--orange);font-weight:600;margin-bottom:8px;display:inline-flex;align-items:center;gap:6px">${ICON.alertTriangle} Ítems no cumple</div>`;
          c.no_cumple.forEach(nc => {
            html += `<div style="font-size:13px;padding:4px 0;line-height:1.5"><span style="color:var(--text-primary)">${nc.item}</span>${nc.detail ? `<br><span style="color:var(--text-secondary)">${nc.detail}</span>` : ''}</div>`;
          });
          html += `</div>`;
        }

        // Merma
        if (c.merma?.length) {
          html += `<div class="cr-merma-box">
            <div style="font-size:12px;font-weight:600;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;letter-spacing:0.5px;display:inline-flex;align-items:center;gap:6px">${ICON.trash} Merma declarada${c.merma_costo_total ? ` — $${c.merma_costo_total}` : ''}</div>`;
          c.merma.forEach(m => {
            html += `<div class="cr-merma-prod">${m.producto} — ${m.cantidad}${m.costo ? ` <span style="color:var(--red);font-size:13px;font-family:var(--mono)">${m.costo}</span>` : ''}</div>
              <div class="cr-merma-detail">${m.motivo ? `Motivo: ${m.motivo}` : ''}${m.autoriza ? ` · Autoriza: ${m.autoriza}` : ''}</div>`;
          });
          html += `</div>`;
        } else if (c.merma_count === 0) {
          html += `<div style="font-size:13px;color:var(--text-secondary);margin-top:8px;display:inline-flex;align-items:center;gap:6px">${ICON.trash} Sin merma declarada</div>`;
        }

        // Piloto automático
        if (c.piloto_auto) {
          html += `<div class="cr-alert-box" style="margin-top:10px">
            <div style="color:var(--red);font-weight:600;margin-bottom:6px;display:inline-flex;align-items:center;gap:6px">${ICON.zap} Piloto automático detectado</div>
            <div style="font-size:13px;color:var(--text);line-height:1.5">${c.piloto_auto}</div>
          </div>`;
        }

        html += `</div>`;
      });

      html += `</div></div>`;
    }

    // ── Section 5: Reviews ──
    if (g || u) {
      html += `
      <div class="dash-section">
        <div class="dash-section-title">REVIEWS</div>
        <div class="dash-grid-2">`;

      if (g) {
        const g1neg = g.bc1?.negativas_7d || 0;
        const g2neg = g.bc2?.negativas_7d || 0;
        const gAccent = (g1neg + g2neg) > 0 ? 'red-accent' : 'green-accent';
        html += `
          <div class="kpi-card ${gAccent}">
            <div class="kpi-label">Google Reviews (7 días)</div>
            <div class="review-platform">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="color:var(--text-primary);font-weight:600">BC1</span>
                ${renderStars(g.bc1?.rating)}
                <span class="review-count">${g.bc1?.rating || '—'} · ${$(g.bc1?.total_reviews)} total</span>
              </div>
              <div class="review-count">${g.bc1?.reviews_7d || 0} nuevas · ${g1neg} neg</div>
            </div>
            <div class="review-platform">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="color:var(--text-primary);font-weight:600">BC2</span>
                ${renderStars(g.bc2?.rating)}
                <span class="review-count">${g.bc2?.rating || '—'} · ${$(g.bc2?.total_reviews)} total</span>
              </div>
              <div class="review-count">${g.bc2?.reviews_7d || 0} nuevas · ${g2neg} neg</div>
            </div>
          </div>`;
      }

      if (u) {
        const uAccent = u.expiring > 0 ? 'red-accent' : u.pending > 0 ? 'blue-accent' : 'green-accent';
        html += `
          <div class="kpi-card ${uAccent}">
            <div class="kpi-label">Uber Eats Reviews</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px">
              <div>
                <div class="kpi-value" style="font-size:24px">${u.pending}</div>
                <div class="kpi-sub" style="margin-top:4px">pendientes</div>
              </div>
              <div>
                <div class="kpi-value ${u.expiring > 0 ? 'red' : ''}" style="font-size:24px">${u.expiring}</div>
                <div class="kpi-sub" style="margin-top:4px">por vencer (≤5d)</div>
              </div>
              <div>
                <div class="kpi-value" style="font-size:24px">${u.new_today}</div>
                <div class="kpi-sub" style="margin-top:4px">nuevas hoy</div>
              </div>
              <div>
                <div class="kpi-value green" style="font-size:24px">${u.responded_today}</div>
                <div class="kpi-sub" style="margin-top:4px">respondidas</div>
              </div>
            </div>
            ${u.urgent?.length ? `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
              <div class="kpi-sub" style="color:var(--red);margin-bottom:8px;display:inline-flex;align-items:center;gap:6px;font-weight:600">${ICON.siren} Urgentes (≤3 días)</div>
              ${u.urgent.map(r => {
                const comment = (r.comentario || '').trim();
                const truncated = comment.length > 50 ? comment.substring(0, 50) + '…' : comment;
                return `<div class="kpi-sub" style="display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap">${renderStars(r.estrellas || 1)}<span style="color:var(--text);font-weight:500">${maskName(r.nombre)}:</span><span title="${comment.replace(/"/g, '&quot;')}">${truncated}</span></div>`;
              }).join('')}
            </div>` : ''}
          </div>`;
      }

      html += `</div></div>`;
    }

    // ── Section 6: Ranking Productos + Curva Horaria + Garzones ──
    const hasGarzones = bd && (bd.garzones_bc1?.length || bd.garzones_bc2?.length || bd.garzones?.length);
    const hasProducts = bd && (bd.product_ranking_revenue?.length || bd.top_productos?.length);
    const hasHourly = bd && bd.hourly_curve?.length;
    if (bd && (hasProducts || hasHourly || hasGarzones)) {
      html += `<div class="dash-section">
        <div class="dash-section-title">DETALLE DEL DÍA</div>`;

      // Ranking Productos (new dual-view format)
      if (bd.product_ranking_revenue?.length) {
        html += `<div class="dash-grid-2" style="margin-bottom:12px">`;
        // By revenue
        html += `<div class="kpi-card">
            <div class="kpi-label" style="color:var(--gold)">Top por Ingresos</div>
            <table class="garzon-table">
              <thead><tr><th>#</th><th>Producto</th><th>Ingresos</th><th>Uds</th></tr></thead>
              <tbody>`;
        bd.product_ranking_revenue.forEach(p => {
          const rowStyle = p.rank <= 3 ? 'color:var(--gold);font-weight:600' : '';
          html += `<tr style="${rowStyle}">
            <td>${p.rank}</td>
            <td>${p.name}</td>
            <td>$${$(p.revenue)}</td>
            <td>${p.units}</td>
          </tr>`;
        });
        html += `</tbody></table></div>`;
        // By units
        if (bd.product_ranking_units?.length) {
          html += `<div class="kpi-card">
            <div class="kpi-label" style="color:#60a5fa">Top por Unidades</div>
            <table class="garzon-table">
              <thead><tr><th>#</th><th>Producto</th><th>Uds</th><th>Ingresos</th></tr></thead>
              <tbody>`;
          bd.product_ranking_units.forEach(p => {
            const rowStyle = p.rank <= 3 ? 'color:#60a5fa;font-weight:600' : '';
            html += `<tr style="${rowStyle}">
              <td>${p.rank}</td>
              <td>${p.name}</td>
              <td>${p.units}</td>
              <td style="color:#666">$${$(p.revenue)}</td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        }
        html += `</div>`;
      } else if (bd.top_productos?.length) {
        // Legacy fallback
        html += `<div class="kpi-card" style="margin-bottom:12px">
            <div class="kpi-label">Top Productos</div>
            <table class="kpi-table">
              <thead><tr><th>#</th><th>Producto</th><th>Uds</th><th>Ingresos</th></tr></thead>
              <tbody>`;
        bd.top_productos.forEach(p => {
          html += `<tr>
            <td>${p.rank}</td>
            <td style="color:#fff">${p.name}</td>
            <td>${p.units}</td>
            <td>$${$(p.revenue)}</td>
          </tr>`;
        });
        html += `</tbody></table></div>`;
      }

      // Curva Horaria
      if (bd.hourly_curve?.length) {
        const maxSales = Math.max(...bd.hourly_curve.map(h => h.sales));
        html += `<div class="kpi-card" style="margin-bottom:12px">
          <div class="kpi-label">Curva Horaria</div>
          <div style="padding:8px 0">`;
        bd.hourly_curve.forEach(h => {
          const pct = maxSales > 0 ? (h.sales / maxSales * 100) : 0;
          const isPeak = h.sales === maxSales;
          const barColor = isPeak ? 'var(--gold)' : 'var(--gold-dim, #8a7030)';
          html += `<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px">
            <span style="min-width:42px;color:#888">${h.label}</span>
            <div style="flex:1;background:var(--card-hover);border-radius:3px;height:14px;overflow:hidden">
              <div style="height:100%;width:${pct.toFixed(1)}%;background:${barColor};border-radius:3px;transition:width .3s"></div>
            </div>
            <span style="min-width:110px;text-align:right;color:${isPeak ? 'var(--gold)' : '#888'};font-weight:${isPeak ? '600' : '400'}">$${$(h.sales)} · ${h.count} ctas</span>
          </div>`;
        });
        const peak = bd.hourly_curve.reduce((a, b) => a.sales > b.sales ? a : b);
        html += `<div style="margin-top:6px;font-size:11px;color:#888">Peak: <strong style="color:var(--gold)">${peak.label}</strong> con $${$(peak.sales)}</div>`;
        html += `</div></div>`;
      }

      // Garzones: new format (per local) or legacy (combined)
      if (bd.garzones_bc1?.length || bd.garzones_bc2?.length) {
        const renderGarzonTable = (list, label, color) => {
          if (!list?.length) return `<div class="kpi-card"><div class="kpi-label" style="color:${color}">${label} — Garzones</div><div style="color:#666;font-size:12px;padding:8px">Sin datos</div></div>`;

            <div class="kpi-label" style="color:${color}">${label} — Garzones</div>

              <thead><tr><th>#</th><th>Nombre</th><th>Ventas</th><th>Ctas</th><th>Ticket</th></tr></thead>
              <tbody>`;
          list.forEach(g => {
            t += `<tr><td>${g.rank}</td><td>${g.name}</td><td>$${$(g.ventas)}</td><td>${g.cuentas}</td><td>$${$(g.ticket)}</td></tr>`;

        // Totals per local
        const bc1t = bd.garzones.filter(g => g.local === 'BC1').reduce((s, g) => s + g.ventas, 0);
        const bc2t = bd.garzones.filter(g => g.local === 'BC2').reduce((s, g) => s + g.ventas, 0);
        const totalNote = bc1t && bc2t ? ` (BC1 $${$(bc1t)} + BC2 $${$(bc2t)})` : '';
        html += `</tbody></table>

      // Medios de pago

    // ── Section 8: Comparativa Semanal Completa ──
    if (w && w.stores?.length) {
      const delta = w.prev_total_presencial ? ((w.total_presencial / w.prev_total_presencial - 1) * 100) : null;

      // Top 10 by revenue + Top 10 by quantity
      if (w.top_by_revenue?.length || w.top_by_quantity?.length) {
        html += `<div class="dash-grid-2">`;

        if (w.top_by_revenue?.length) {

        }
        html += `</div>`;
      }

      // Garzones + Canales
      if (w.weekly_garzones?.length || w.weekly_channels?.length) {
        html += `<div class="dash-grid-2">`;

        if (w.weekly_garzones?.length) {
          html += `<div class="kpi-card">
            <div class="kpi-label">Garzones — Semana</div>
            <table class="garzon-table">
              <thead><tr><th>#</th><th>Nombre</th><th>Ventas</th><th>Anterior</th><th>Δ</th></tr></thead>
              <tbody>`;
          w.weekly_garzones.forEach((g, i) => {
            html += `<tr>
              <td>${i + 1}</td>
              <td>${g.name}${g.local ? ` <span style="color:#666;font-size:10px">${g.local}</span>` : ''}</td>
              <td>$${$(g.sales)}</td>
              <td style="color:#888">$${$(g.prev_sales)}</td>
              <td>${dBadge(g.delta_pct)}</td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        }

        if (w.weekly_channels?.length) {
          html += `<div class="kpi-card">
            <div class="kpi-label">Canales — Semana <span style="font-size:10px;color:#555;font-weight:400">(solo presencial)</span></div>
            <table class="kpi-table">
              <thead><tr><th>Canal</th><th>Ventas</th><th>%</th><th>Anterior</th><th>Δ</th></tr></thead>
              <tbody>`;
          w.weekly_channels.forEach(ch => {
            html += `<tr>
              <td style="color:#fff">${ch.name}</td>
              <td>$${$(ch.sales)}</td>
              <td>${ch.pct}%</td>
              <td style="color:#888">$${$(ch.prev_sales)}</td>
              <td>${dBadge(ch.delta_pct)}</td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        }
        html += `</div>`;
      }

      // KPIs por local (mantener como referencia compacta)
      html += `<div class="dash-grid-2">`;
      w.stores.forEach(store => {
        if (!store.kpis) return;
        html += `<div class="kpi-card">
            <div class="kpi-label">${store.store_name} — KPIs Específicos</div>
            <table class="kpi-table">
              <thead><tr><th>Producto</th><th>Actual</th><th>Bench</th><th>Δ</th></tr></thead>
              <tbody>`;
        Object.entries(store.kpis).forEach(([name, kpi]) => {
          const actual = kpi.actual ?? kpi.total ?? 0;
          const bench = kpi.benchmark ?? 0;
          const diff = bench > 0 ? actual - bench : 0;
          const cls = diff >= 0 ? 'val-up' : 'val-down';
          const sign = diff >= 0 ? '+' : '';
          html += `<tr><td>${name}</td><td style="color:#fff">${actual}</td><td>${bench}</td><td class="${cls}">${sign}${diff}</td></tr>`;
        });
        html += `</tbody></table></div>`;
      });
      html += `</div></div>`;
    }

    el.innerHTML = html;
  }
