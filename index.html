        html += `</div></div></div>`;
      }
    }

    // ── Section 7: Estimado de Compra ──
    if (ec && ec.items?.length) {
      html += `
      <div class="dash-section">
        <div class="dash-section-title">ESTIMADO DE COMPRA ${ec.fecha ? '— ' + ec.fecha : ''}</div>
        <div class="kpi-card">
          <div style="display:flex;gap:20px;margin-bottom:12px">
            <div class="kpi-sub">Items: <span style="color:#fff">${ec.total_items}</span></div>
            ${ec.urgentes > 0 ? `<div class="kpi-sub">Urgentes: <span style="color:var(--red)">${ec.urgentes}</span></div>` : ''}
            ${ec.horizonte ? `<div class="kpi-sub">Horizonte: <span style="color:var(--text-dim)">${ec.horizonte}d</span></div>` : ''}
          </div>
          ${ec.items.map(item => `
            <div class="ec-item">
              <div>
                <span class="ec-badge ${(item.status || '').toLowerCase().includes('urgente') ? 'ec-urgente' : 'ec-normal'}">${item.local || '?'}</span>
                <span style="color:var(--text-dim);margin-left:8px">${item.producto || '?'}</span>
              </div>
              <div style="display:flex;gap:16px;align-items:center">
                ${item.cobertura_dias != null ? `<span class="kpi-sub" style="margin:0;color:${item.cobertura_dias < 1 ? 'var(--red)' : 'var(--text-muted)'}">${item.cobertura_dias}d</span>` : ''}
                <span style="color:var(--gold);font-weight:600">${item.recomendado || '?'}</span>
                ${item.proveedor ? `<span class="kpi-sub" style="margin:0">${item.proveedor}</span>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
    }

    // ── Section 8: Comparativa Semanal Completa ──
    if (w && w.stores?.length) {
      const delta = w.prev_total_presencial ? ((w.total_presencial / w.prev_total_presencial - 1) * 100) : null;
      const deltaStr = delta != null ? (delta >= 0 ? '+' : '') + delta.toFixed(1) + '%' : '';
      const dBadge = (d) => d == null ? '' : `<span class="kpi-badge ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d.toFixed(1)}%</span>`;

      html += `
      <div class="dash-section">
        <div class="dash-section-title">COMPARATIVA SEMANAL — Sem ${w.week_num} (${fmtDate(w.start_date)} al ${fmtDate(w.end_date)})</div>
        <div class="kpi-card" style="margin-bottom:12px">
          <div class="kpi-sub">
            Total presencial: <span style="color:#fff;font-weight:600">$${$(w.total_presencial)}</span>
            <span style="color:#888;margin:0 6px">vs</span>$${$(w.prev_total_presencial)}
            ${deltaStr ? `<span class="kpi-badge ${delta >= 0 ? 'up' : 'down'}">${deltaStr}</span>` : ''}
          </div>
        </div>`;

      // Top 10 by revenue + Top 10 by quantity
      if (w.top_by_revenue?.length || w.top_by_quantity?.length) {
        html += `<div class="dash-grid-2">`;

        if (w.top_by_revenue?.length) {
          html += `<div class="kpi-card">
            <div class="kpi-label">Top 10 por Monto</div>
            <table class="kpi-table">
              <thead><tr><th>#</th><th>Producto</th><th>Actual</th><th>Anterior</th><th>Δ</th></tr></thead>
              <tbody>`;
          w.top_by_revenue.forEach((p, i) => {
            html += `<tr>
              <td>${i + 1}</td>
              <td style="color:#fff">${p.name}</td>
              <td>$${$(p.current)}</td>
              <td style="color:#888">$${$(p.previous)}</td>
              <td>${dBadge(p.delta_pct)}</td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        }

        if (w.top_by_quantity?.length) {
          html += `<div class="kpi-card">
            <div class="kpi-label">Top 10 por Cantidad</div>
            <table class="kpi-table">
              <thead><tr><th>#</th><th>Producto</th><th>Actual</th><th>Anterior</th><th>Δ</th></tr></thead>
              <tbody>`;
          w.top_by_quantity.forEach((p, i) => {
            html += `<tr>
              <td>${i + 1}</td>
              <td style="color:#fff">${p.name}</td>
              <td>${p.current}</td>
              <td style="color:#888">${p.previous}</td>
              <td>${dBadge(p.delta_pct)}</td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        }
        html += `</div>`;
      }

      // Garzones + Canales
      if (w.weekly_garzones?.length || w.weekly_channels?.length) {
        html += `<div class="dash-grid-2">`;

        if (w.weekly_garzones?.length) {
          html += `<div class="kpi-card">
            <div class="kpi-label">Garzones — Semana</div>
            <table class="garzon-table">
              <thead><tr><th>#</th><th>Nombre</th><th>Ventas</th><th>Anterior</th><th>Δ</th></tr></thead>
              <tbody>`;
          w.weekly_garzones.forEach((g, i) => {
            html += `<tr>
              <td>${i + 1}</td>
              <td>${g.name}${g.local ? ` <span style="color:#666;font-size:10px">${g.local}</span>` : ''}</td>
              <td>$${$(g.sales)}</td>
              <td style="color:#888">$${$(g.prev_sales)}</td>
              <td>${dBadge(g.delta_pct)}</td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        }

        if (w.weekly_channels?.length) {
          html += `<div class="kpi-card">
            <div class="kpi-label">Canales — Semana <span style="font-size:10px;color:#555;font-weight:400">(solo presencial)</span></div>
            <table class="kpi-table">
              <thead><tr><th>Canal</th><th>Ventas</th><th>%</th><th>Anterior</th><th>Δ</th></tr></thead>
              <tbody>`;
          w.weekly_channels.forEach(ch => {
            html += `<tr>
              <td style="color:#fff">${ch.name}</td>
              <td>$${$(ch.sales)}</td>
              <td>${ch.pct}%</td>
              <td style="color:#888">$${$(ch.prev_sales)}</td>
              <td>${dBadge(ch.delta_pct)}</td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        }
        html += `</div>`;
      }

      // KPIs por local (mantener como referencia compacta)
      html += `<div class="dash-grid-2">`;
      w.stores.forEach(store => {
        if (!store.kpis) return;
        html += `<div class="kpi-card">
            <div class="kpi-label">${store.store_name} — KPIs Específicos</div>
            <table class="kpi-table">
              <thead><tr><th>Producto</th><th>Actual</th><th>Bench</th><th>Δ</th></tr></thead>
              <tbody>`;
        Object.entries(store.kpis).forEach(([name, kpi]) => {
          const actual = kpi.actual ?? kpi.total ?? 0;
          const bench = kpi.benchmark ?? 0;
          const diff = bench > 0 ? actual - bench : 0;
          const cls = diff >= 0 ? 'val-up' : 'val-down';
          const sign = diff >= 0 ? '+' : '';
          html += `<tr><td>${name}</td><td style="color:#fff">${actual}</td><td>${bench}</td><td class="${cls}">${sign}${diff}</td></tr>`;
        });
        html += `</tbody></table></div>`;
      });
      html += `</div></div>`;
    }

    el.innerHTML = html;
  }

  function channelBar(label, pct, color) {
    if (pct == null) return '';
    return `<div class="channel-row">
      <span class="channel-label">${label}</span>
      <div class="channel-bar"><div class="channel-fill ${color}" style="width:${Math.min(pct, 100)}%"></div></div>
      <span class="channel-pct">${pct.toFixed(1)}%</span>
    </div>`;
  }


  // ── WORKFLOW METADATA (updated 05-may-2026) ────────────────────────
  const WORKFLOW_META = {
    'Briefing Diario BlackChicken': {
      icon: '◉', category: 'diario',
      desc: 'Ventas, canales, productos top, checklists y alertas del día anterior',
      schedule: '03:00 Chile', cron: true, hasDateInput: true,
    },
    'Análisis Diario CheckRocket': {
      icon: '✓', category: 'diario',
      desc: 'Checklists BC1 y BC2: cumplimiento, temperaturas, merma y no-cumple',
      schedule: '04:00 Chile', cron: true, hasDateInput: true,
    },
    'Cuadratura Diaria BlackChicken': {
      icon: '⊞', category: 'diario',
      desc: 'Cruza ventas Justo vs compras Ruka — genera Excel + reporte HTML',
      schedule: '07:50 Chile', cron: true, hasDateInput: true,
    },
    'Briefing Matutino → Telegram': {
      icon: '✈', category: 'diario',
      desc: 'Envía resumen del briefing al canal de Telegram a las 06:30',
      schedule: '06:30 Chile', cron: true, hasDateInput: false,
    },
    'Vigía de Ventas → Telegram': {
      icon: '👁', category: 'diario',
      desc: 'Alerta en Telegram si las ventas del día están bajo el 90% del objetivo',
      schedule: '05:30 Chile', cron: true, hasDateInput: false,
    },
    'Patrulla CheckRocket → Telegram': {
      icon: '🛡', category: 'diario',
      desc: 'Envía reporte de checklists al canal de Telegram',
      schedule: '06:00 Chile', cron: true, hasDateInput: false,
    },
    'Google Reviews — Apify Scraper': {
      icon: '🔍', category: 'diario',
      desc: 'Scraping Google Reviews via Apify para BC1 y BC2 — genera JSON',
      schedule: '06:15 Chile', cron: true, hasDateInput: false,
    },
    'Uber Eats Reviews — BC1': {
      icon: '🟠', category: 'diario',
      desc: 'Lee reviews Uber Eats desde Notion — genera JSON para alertas',
      schedule: '06:30 Chile', cron: true, hasDateInput: false,
    },
    'Reviews Uber Eats → Telegram': {
      icon: '⭐', category: 'diario',
      desc: 'Reviews consolidadas (Google + Uber) → Telegram con semáforo',
      schedule: '07:00 Chile', cron: true, hasDateInput: false,
    },
    'Reporte Semanal BlackChicken': {
      icon: '≡', category: 'semanal',
      desc: 'Resumen semanal de ventas, productos, operaciones y KPIs',
      schedule: 'Lunes · 08:00 Chile', cron: true, hasDateInput: false,
    },
    'Ventas Semanales BlackChicken': {
      icon: '▲', category: 'semanal',
      desc: 'Infografías semanales de ventas por producto y local + mensaje WhatsApp',
      schedule: 'Lunes · 08:10 Chile', cron: true, hasDateInput: true,
    },
    'Estimado de Compra v2.1': {
      icon: '📦', category: 'semanal',
      desc: 'Estimado semanal de compras por ingrediente, proveedor y déficit de stock',
      schedule: 'Lunes · 08:20 Chile', cron: true, hasDateInput: false,
    },
    'Reporte Mensual BlackChicken': {
      icon: '◈', category: 'mensual',
      desc: 'Reporte ejecutivo mensual con YoY, top productos, compras Ruka e insights',
      schedule: 'Día 1 · 08:30 Chile', cron: true, hasDateInput: false,
    },
    'Validación Cruzada Semanal BlackChicken': {
      icon: '⊗', category: 'desactivado',
      desc: 'Valida coherencia entre ventas registradas y compras del período',
      schedule: 'Desactivado', cron: false, hasDateInput: false,
    },
    'Alertas Diarias BlackChicken': {
      icon: '⚡', category: 'desactivado',
      desc: 'Alertas automáticas cuando métricas operacionales salen de rango — legacy',
      schedule: 'Desactivado', cron: false, hasDateInput: true,
    },
    'Envío Emails Matutinos': {
      icon: '✉', category: 'desactivado',
      desc: 'Enviador centralizado legacy — reemplazado por email por workflow',
      schedule: 'Desactivado', cron: false, hasDateInput: true,
    },
  };

  const SECTION_ORDER = ['diario', 'semanal', 'mensual', 'desactivado'];
  const SECTION_LABELS = {
    diario:      { label: 'Diarios',      pill: 'pill-diario' },
    semanal:     { label: 'Semanales',    pill: 'pill-semanal' },
    mensual:     { label: 'Mensuales',    pill: 'pill-mensual' },
    desactivado: { label: 'Desactivados', pill: 'pill-desactivado' },
  };

  let activeWorkflowId = null;
  let activeHasDateInput = false;

  // ── Load workflows ─────────────────────────────────────────────────
  async function loadWorkflows() {
    const refreshBtn = document.getElementById('refresh-btn');
    refreshBtn.classList.add('spinning');

    try {
      const resp = await fetch('/api/workflows');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const workflows = await resp.json();
      renderWorkflows(workflows);
      document.getElementById('status-text').textContent = 'CONECTADO';
    } catch (err) {
      console.error(err);
      document.getElementById('status-text').textContent = 'ERROR';
      document.getElementById('sections-container').innerHTML = `
        <div class="error-state">
          No se pudo conectar con GitHub Actions
          <p>${err.message}</p>
        </div>`;
    } finally {
      refreshBtn.classList.remove('spinning');
    }
  }

  // ── Render ─────────────────────────────────────────────────────────
  function renderWorkflows(workflows) {
    const container = document.getElementById('sections-container');
    container.innerHTML = '';

    // Group by category
    const grouped = { diario: [], semanal: [], mensual: [], desactivado: [], otros: [] };

    workflows.forEach(wf => {
      const meta = WORKFLOW_META[wf.name];
      const cat = meta?.category || (wf.state === 'active' ? 'diario' : 'desactivado');
      if (grouped[cat]) grouped[cat].push({ wf, meta });
      else grouped.otros.push({ wf, meta });
    });

    // Count active (non-desactivado)
    const activeCount = (grouped.diario.length + grouped.semanal.length + grouped.mensual.length);
    const totalCount  = workflows.length;

    // Render sections in order
    let sectionIdx = 0;
    SECTION_ORDER.forEach(cat => {
      const items = grouped[cat];
      if (!items || items.length === 0) return;

      const { label, pill } = SECTION_LABELS[cat];
      const section = document.createElement('div');
      section.className = 'section-group';

      let cardsHtml = '';
      items.forEach(({ wf, meta }, i) => {
        const m = meta || {
          icon: '◎', category: cat,
          desc: wf.path?.replace('.github/workflows/', '') || '',
          schedule: wf.state === 'active' ? 'Activo' : 'Desactivado',
          cron: false, hasDateInput: true,
        };

        const { statusClass, conclusionBadge } = getStatus(wf);
        const lastRunHtml = getLastRunHtml(wf, m);
        const delay = (sectionIdx * 0.05).toFixed(2);
        sectionIdx++;

        const isDisabled = cat === 'desactivado';
        const triggerBtn = isDisabled
          ? `<button class="btn-trigger" disabled style="opacity:0.3;cursor:not-allowed">⊘ Desactivado</button>`
          : `<button class="btn-trigger" onclick="openModal(${wf.id}, '${escHtml(wf.name)}', '${escHtml(m.desc)}', '${m.icon}', ${m.hasDateInput})">▶ Ejecutar</button>`;

        cardsHtml += `
          <div class="card ${statusClass}${isDisabled ? ' status-disabled' : ''}" style="animation-delay:${delay}s;${isDisabled ? 'opacity:0.55;' : ''}">
            <div class="card-top">
              <div class="card-icon">${m.icon}</div>
              <div class="card-badges">
                ${conclusionBadge}
                <span class="badge ${m.cron ? 'badge-cron' : 'badge-manual'}">
                  ${m.cron ? '⏱ ' + m.schedule : m.schedule}
                </span>
              </div>
            </div>
            <div>
              <div class="card-name">${cleanName(wf.name)}</div>
              <div class="card-desc" style="margin-top:6px">${m.desc}</div>
            </div>
            <div class="card-meta">${lastRunHtml}</div>
            <div class="card-footer">
              ${triggerBtn}
              ${wf.lastRun?.url ? `<a class="btn-logs" href="${wf.lastRun.url}" target="_blank" title="Ver logs">↗</a>` : ''}
            </div>
          </div>`;
      });

      section.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
          <span class="section-pill ${pill}">${label}</span>
          <span class="section-count" style="font-family:var(--mono);font-size:11px;color:#555">${items.length} workflow${items.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="grid">${cardsHtml}</div>`;

      container.appendChild(section);

      // Divider between sections (not after last)
      if (cat !== 'desactivado') {
        const hr = document.createElement('hr');
        hr.className = 'section-divider';
        container.appendChild(hr);
      }
    });

    // Update header count
    const statusEl = document.getElementById('status-text');
    statusEl.textContent = `${activeCount} activos · ${totalCount} total`;
  }

  function cleanName(name) {
    return name.replace(' BlackChicken', '');
  }

  function escHtml(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function getStatus(wf) {
    if (!wf.lastRun) {
      return { statusClass: '', conclusionBadge: '<span class="badge badge-none">Sin runs</span>' };
    }
    const { status, conclusion } = wf.lastRun;
    if (status === 'in_progress' || status === 'queued') {
      return { statusClass: 'status-running', conclusionBadge: '<span class="badge badge-running">● En ejecución</span>' };
    }
    if (conclusion === 'success') {
      return { statusClass: 'status-success', conclusionBadge: '<span class="badge badge-ok">✓ Exitoso</span>' };
    }
    if (conclusion === 'failure') {
      return { statusClass: 'status-failure', conclusionBadge: '<span class="badge badge-fail">✕ Fallido</span>' };
    }
    if (conclusion === 'cancelled') {
      return { statusClass: '', conclusionBadge: '<span class="badge badge-cancelled">⊘ Cancelado</span>' };
    }
    return { statusClass: '', conclusionBadge: '<span class="badge badge-none">—</span>' };
  }

  function getLastRunHtml(wf, wfMeta) {
    if (!wf.lastRun) return '<div class="meta-row"><span class="meta-label">Último run</span><span class="meta-value">Nunca</span></div>';

    const { createdAt, duration, event } = wf.lastRun;
    const timeAgo = formatAgo(createdAt);
    const dur = duration ? `${Math.floor(duration / 60)}m ${duration % 60}s` : '—';
    let eventLabel;
    if (event === 'schedule') {
      const d = new Date(createdAt);
      const dd = String(d.getDate()).padStart(2,'0');
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const hh = String(d.getHours()).padStart(2,'0');
      const min = String(d.getMinutes()).padStart(2,'0');
      const freq = wfMeta && wfMeta.frequency ? wfMeta.frequency : 'Auto';
      eventLabel = `⏱ ${freq} · ${dd}/${mm} ${hh}:${min}`;
    } else if (event === 'workflow_dispatch') {
      eventLabel = '▶ Manual';
    } else {
      eventLabel = event;
    }

    return `
      <div class="meta-row">
        <span class="meta-label">Último run</span>
        <span class="meta-value">${timeAgo}</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Duración</span>
        <span class="meta-value">${dur}</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Trigger</span>
        <span class="meta-value">${eventLabel}</span>
      </div>
    `;
  }

  function formatAgo(isoStr) {
    const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
    if (diff < 60) return 'hace ' + diff + 's';
    if (diff < 3600) return 'hace ' + Math.floor(diff / 60) + 'm';
    if (diff < 86400) return 'hace ' + Math.floor(diff / 3600) + 'h';
    return 'hace ' + Math.floor(diff / 86400) + 'd';
  }

  // ── Modal ──────────────────────────────────────────────────────────
  function openModal(id, name, desc, icon, hasDateInput) {
    activeWorkflowId = id;
    activeHasDateInput = hasDateInput;

    document.getElementById('modal-icon').textContent = icon;
    document.getElementById('modal-title').textContent = cleanName(name);
    document.getElementById('modal-desc').textContent = desc;

    const dateGroup = document.getElementById('date-group');
    dateGroup.style.display = hasDateInput ? 'block' : 'none';
    document.getElementById('date-input').value = '';

    document.getElementById('btn-confirm').disabled = false;
    document.getElementById('confirm-text').textContent = '▶ EJECUTAR';

    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    activeWorkflowId = null;
  }

  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // ── Trigger ────────────────────────────────────────────────────────
  async function confirmTrigger() {
    if (!activeWorkflowId) return;

    const btn = document.getElementById('btn-confirm');
    const confirmText = document.getElementById('confirm-text');
    const dateInput = document.getElementById('date-input');

    btn.disabled = true;
    confirmText.innerHTML = '<span class="spinner"></span> EJECUTANDO...';

    const body = { workflowId: activeWorkflowId };
    if (activeHasDateInput && dateInput.value) {
      body.date = dateInput.value;
    }

    try {
      const resp = await fetch('/api/trigger', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await resp.json();

      if (data.success) {
        showToast('Workflow ejecutado', 'Se disparó correctamente. Puede tardar unos segundos en aparecer en GitHub Actions.', false);
        closeModal();
        setTimeout(loadWorkflows, 4000);
      } else {
        throw new Error(data.error || 'Error desconocido');
      }
    } catch (err) {
      showToast('Error al ejecutar', err.message, true);
      btn.disabled = false;
      confirmText.textContent = '▶ EJECUTAR';
    }
  }

  // ── Toast ──────────────────────────────────────────────────────────
  function showToast(title, msg, isError = false) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.innerHTML = `<strong>${title}</strong>${msg}`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'slideOut 0.3s ease forwards';
      setTimeout(() => toast.remove(), 300);
    }, 4500);
  }

  // ── Auto-refresh ───────────────────────────────────────────────────
  loadWorkflows();
  setInterval(loadWorkflows, 45000);

  // ── Init ───────────────────────────────────────────────────────────
  loadDashboard();
  setInterval(loadDashboard, 120000);   // refresh dashboard every 2 min
</script>
